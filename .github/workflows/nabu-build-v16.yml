name: nabu v16 - official 4.14.180 + KernelSU v1.0.5 + SUSFS v1.5.9, STAGE 0/1/2

# Device : Xiaomi Pad 5 (nabu) / SM8150 (SDM860) / kernel 4.14.180 / non-GKI
# Base   : MiCode/Xiaomi_Kernel_OpenSource @ nabu-r-oss   <-- the only official nabu branch
# Root   : tiann KernelSU v1.0.5, CONFIG_KSU=y (built in - non-GKI cannot load it as a module)
# SUSFS  : v1.5.9 NON-GKI, TIF scheme (thread_info->flags bit 33), kernel side + KSU side
#
# WHAT CHANGED FROM v13 AND WHY
# -----------------------------
# v13 targeted Kuugo's 4.14.336 private fork and blamed CONFIG_MODULE_FORCE_LOAD for
# the VT driver refusing to load. Both were wrong:
#
#   * the official tree is 4.14.180, and the modules the vendor ships were built
#     against 4.14.180-perf-gcc5ee28d3084. Whatever 4.14.336 does to its own
#     module loader is irrelevant to a driver built for 4.14.180.
#   * official kernel/module.c is the stock implementation: IGNORE_VERMAGIC /
#     IGNORE_MODVERSIONS are only set when insmod passes -f, and the VT log shows
#     a plain insmod with app arguments. FORCE_LOAD therefore cannot help; with
#     FORCE_LOAD=y it would only weaken the check nobody reaches.
#   * so v14 matches the vermagic exactly, keeps every ABI-relevant CONFIG at its
#     official value, and asserts CONFIG_MODULE_FORCE_LOAD is *n*.
#
# STAGES (workflow_dispatch input `stage`)
#   0  official tree + official config only. No KSU, no SUSFS, no patch.
#      Produces a bootable package whose uname -r must be exactly
#      4.14.180-perf-gcc5ee28d3084. Ten minutes to prove the vermagic theory
#      before paying for a full SUSFS tree.
#   1  stage 0 + KernelSU v1.0.5 + inline hooks (KPROBES=n, so every hook is hand
#      inserted) + Module.symvers CRC report.
#   2  stage 1 + SUSFS v1.5.9 kernel side and KSU side + the 7 features this 4.14
#      VFS can host + Module.symvers CRC report.
#
# THIS IS A PARTIAL SUSFS - stated here so nobody is surprised later
# ---------------------------------------------------------------
# 4.14's VFS cannot host the following, and they are forced off in every stage:
#   SUS_PATH, SUS_MOUNT, OPEN_REDIRECT, SUS_SU, HAS_MAGIC_MOUNT, AUTO_ADD_*.
# They depend on >=5.4 primitives this tree does not have: lookup_slow() retry on
# an unhashed dentry, mountpoint_hashtable, ida_alloc_min(), cached-dentry
# i_state flags. Consequence: SUSFS cannot hide /data/adb/VT itself, and cannot
# hide mounts. What it can still do on 4.14: spoof uname, spoof /proc/cmdline,
# hide ksu/susfs symbols from /proc/kallsyms, try_umount for non-root uids, and
# stat/maps kstat spoofing.
#
# Toolchain (input `toolchain`) - this is the biggest remaining unknown
# -------------------------------------------------------------------
# The official banner says "clang version 10.0.6 for Android NDK". AOSP's
# prebuilts clang-r377782d reports exactly 10.0.6 (verified: AndroidVersion.txt
# in android-11.0.0_r1 says "10.0.6 based on r377782d"), and that is what the
# default `aosp` path downloads. Two notes so nobody chases the wrong tree:
#   * clang-r353983c is 9.0.3, not 10.0.6. Do not substitute it.
#   * the vendor built with NDK r21e's packaging of clang 10.0.6. The AOSP
#     prebuilt is the same compiler version but not byte-identical tooling, so a
#     4.14 tree may still need a -Wno-* nudge. Any such error appears in
#     build-baseline.log / build.log and is one sed away.
#   neutron  clang 24. Kuugo built a 4.14.336 tree with it, so it is possible,
#     but a 2019 tree needs the flag surgery already written into the build step
#     (-fcommon, the dropped -mllvm flag, the -Wno-error set).
#
# v16 fixes (20 confirmed defects, applied in four batches)
#   1. #4  baseline: payload unpack moved to step 4 so it precedes every gate;
#          config becomes step 5, gate step 6, and the whole tail shifts by one.
#   2. #4  baseline gate is now 30 inline symbols; the cmd_gate call is gone
#          (it used to always fall through to a 14-symbol fallback).
#   3. #0  check() no longer dies under `set -euo pipefail`: the grep pipeline
#          ends in a trailing fallback, the `&&` one-liner became an if, both greps get
#          2>/dev/null. Without this the first `n` expectation killed the step.
#   4. #2  build gate is stage-aware: cmd_gate only runs in stage 2, stage 1 uses
#          the same 30-symbol inline gate plus KSU=y / KSU_SUSFS=n.
#   5. #1  fs/proc/task_mmu.c gets its `#include <linux/susfs_def.h>` from the
#          yml (inside the stage-2 arm, before path_umount), then asserted.
#   6. #5  build-job unpack carries the same three SUSFS guards as baseline.
#   7. #3  step 9 check2 branches on pack_dtb instead of always demanding =n.
#   8. #7  step 9 check1 asserts the real KBUILD_DTBO_IMG rule instead of
#          claiming no dtbo.img target exists.
#   9. #15 vermagic gate records the Image size against kernel_size 41695744.
#  10. #6  stage 0 package rewrites kernel.string so it stops claiming KSU+SUSFS.
#  11. #8  the baseline toggle input is removed; symvers download, CRC report and upload
#          are unconditional (the CRC report is the only .ko-loadability gate).
#  12. #9  KSU_VERSION is derived as 10000 + commit_count + 200 and sed-ed into
#          drivers/kernelsu/Makefile, instead of the hardcoded value.
#  13. #11 KSU_MANAGER_PACKAGE is passed to make and its log line asserted.
#  14. #10 the package documents that it carries no magiskboot/busybox and
#          asserts tools/ak3-core.sh is present.
#  15. #12 anykernel.sh must keep exactly two patch_vbmeta_flag lines.
#  16. #13 `cp -r ak3_base/*` no longer swallows a missing payload directory.
#  17. #14 every artifact renamed v15 -> v16; README sentence repaired.
#  18. #16 AnyKernel3 is cloned then checked out at a pinned commit.
#  19. #17 the AOSP toolchain path asserts clang 10.x instead of only printing.
#  20. #18 the symvers joins no longer swallow failures and the sorts are LC_ALL=C,
#          so the CRC verdict cannot silently degrade to SAFE.
#
# Still unresolved on purpose (needs a decision or a real device, not a patch):
#   A. the embedded 50_add patch is generated for SUSFS v1.5.8 while susfs.h
#      says v1.5.9 - the payload is one version behind its own header.
#   B. fs/proc/task_mmu.c's missing include and the stage-1 gate are patched in
#      this yml, but the root fixes belong in the payload: fixups() should add
#      the include, and cmd_gate should take a stage argument.
#      (The old note claiming 50_add never reaches fs/namespace.c was wrong:
#       apply50 lands namespace.c #1 and #19, and verify() passes all three
#       namespace markers. The patcher also has no HOSTABLE whitelist any more.)
#
# Three things this yml cannot close, so do not read v16 as "verified working":
#   1. whether clang 10 actually compiles this 2019 tree. Unknown errors are
#      still possible; the failing log is uploaded as an artifact.
#   2. the VT driver's real vermagic / __versions. It has never been read, so
#      the target string is still an inference from the official Image. Needs
#      the tablet back.
#   3. whether the flashing environment provides magiskboot (see #10).
#
# Everything the build needs is embedded: the SUSFS v1.5.9 snapshot, the patcher,
# the official IKCONFIG dump, the AK3 script and the dtb/dtbo blobs. No build step
# fetches a patch from a third-party repository.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "0 = official only, 1 = +KernelSU, 2 = +KernelSU +SUSFS"
        required: true
        default: "0"
        type: choice
        options: ["0", "1", "2"]
      toolchain:
        description: "aosp = clang 10 (recommended) / neutron = clang 24"
        required: true
        default: "aosp"
        type: choice
        options: ["aosp", "neutron"]
      pack_dtb:
        description: "Diagnostic: also build dtbs from the tree and check they contain nabu (dtb/dtbo.img in the package stay the v0.2 blobs)"
        type: boolean
        default: false

env:
  KERNEL_REPO: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git"
  KERNEL_BRANCH: "nabu-r-oss"
  KSU_TAG: "v1.0.5"
  KSU_MANAGER_PACKAGE: "me.weishu.kernelsu"
  # KSU v1.0.5 kernel/Makefile defaults these to the official manager;
  # they are spelled out so the build log proves which manager was baked in.
  KSU_EXPECTED_HASH: "c371061b19d8c7d7d6133c6a9bafe198fa944e50c1b31c9d8daa8d7f1fc2d2d6"
  KSU_EXPECTED_SIZE: "0x033b"
  TARGET_UTS_RELEASE: "4.14.180-perf-gcc5ee28d3084"
  TARGET_VERMAGIC: "4.14.180-perf-gcc5ee28d3084 SMP preempt mod_unload modversions aarch64"
  CONFIG_SHA256: "0e881f458c4fc225f9ffec4e27b6303c8f1a34b23586ec855f8c78419909aa7f"
  PAYLOAD_SHA256: "eea31f8b3a7d4fdbff85591c45047026924650503f67bbe8db5754002f762a11"
  AOSP_CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r1/clang-r377782d.tar.gz"
  # AnyKernel3 HEAD at generation time (git ls-remote ... HEAD). Pinned only to
  # freeze the script the package is built against; it has NOT been validated
  # against this device. An empty value falls back to whatever HEAD is.
  AK3_COMMIT: "41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1"

# Least privilege: this workflow only reads the repo and uploads artifacts.
permissions:
  contents: read

jobs:
  # ==========================================================================
  # baseline - official tree, official config, nothing else.
  # Stage 0 uses this as the shipped artifact. Stage 1/2 use its Module.symvers
  # as the CRC reference, so the comparison is "official vs official+KSU+SUSFS"
  # instead of v13's meaningless "Kuugo vs Kuugo+addons".
  # ==========================================================================
  baseline:
    # Always run. Stage 0 ships this job's package; stage 1/2 need its
    # Module.symvers as the CRC reference. Both consumers are unconditional now,
    # so a conditional here would silently cancel `build` (needs: baseline).
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "1. host deps"
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y build-essential git zip unzip xz-utils bc flex bison \
            libssl-dev libelf-dev python3 device-tree-compiler ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: "2. toolchain"
        run: |
          set -euo pipefail
          mkdir -p tc
          if [ "${{ inputs.toolchain }}" = "neutron" ]; then
            cd tc
            curl -fsSL --retry 3 -o antman https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
            chmod +x antman
            ./antman -S
            ./antman -I
          else
            # AOSP prebuilts clang 10.0.6 == clang-r377782d. That is the exact
            # version the official banner reports, so this is the closest
            # available match to the vendor toolchain.
            curl -fsSL --retry 3 -o clang.tar.gz "$AOSP_CLANG_URL"
            mkdir -p tc
            tar -xzf clang.tar.gz -C tc
            rm -f clang.tar.gz
            test -x tc/bin/clang
            tc/bin/clang --version | head -1
          tc/bin/clang --version | grep -q 'clang version 10\.' \
            || { echo "FATAL: aosp clang is not 10.x - banner mismatch"; exit 1; }
          fi

      - name: "3. source + Makefile gate"
        run: |
          set -euo pipefail
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" src
          cd src
          echo "HEAD: $(git rev-parse HEAD)"

          # Q1: prove the checkout really is 4.14.180 before anything is built.
          V=$(awk '/^VERSION =/{print $3}' Makefile)
          P=$(awk '/^PATCHLEVEL =/{print $3}' Makefile)
          S=$(awk '/^SUBLEVEL =/{print $3}' Makefile)
          echo "Makefile says: $V.$P.$S"
          test "$V" = "4"      || { echo "FATAL: VERSION=$V"; exit 1; }
          test "$P" = "14"     || { echo "FATAL: PATCHLEVEL=$P"; exit 1; }
          test "$S" = "180"    || { echo "FATAL: SUBLEVEL=$S"; exit 1; }

          test -f arch/arm64/configs/nabu_user_defconfig || { echo "FATAL: nabu_user_defconfig missing"; exit 1; }
          echo "nabu_user_defconfig: $(wc -c < arch/arm64/configs/nabu_user_defconfig) bytes"

      - name: "4. unpack the embedded toolkit"
