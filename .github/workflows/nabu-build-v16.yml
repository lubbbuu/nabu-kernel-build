name: nabu v16 - official 4.14.180 + KernelSU v1.0.5 + SUSFS v1.5.9, STAGE 0/1/2

# Device : Xiaomi Pad 5 (nabu) / SM8150 (SDM860) / kernel 4.14.180 / non-GKI
# Base   : MiCode/Xiaomi_Kernel_OpenSource @ nabu-r-oss   <-- the only official nabu branch
# Root   : tiann KernelSU v1.0.5, CONFIG_KSU=y (built in - non-GKI cannot load it as a module)
# SUSFS  : v1.5.9 NON-GKI, TIF scheme (thread_info->flags bit 33), kernel side + KSU side
#
# WHAT CHANGED FROM v13 AND WHY
# -----------------------------
# v13 targeted Kuugo's 4.14.336 private fork and blamed CONFIG_MODULE_FORCE_LOAD for
# the VT driver refusing to load. Both were wrong:
#
#   * the official tree is 4.14.180, and the modules the vendor ships were built
#     against 4.14.180-perf-gcc5ee28d3084. Whatever 4.14.336 does to its own
#     module loader is irrelevant to a driver built for 4.14.180.
#   * official kernel/module.c is the stock implementation: IGNORE_VERMAGIC /
#     IGNORE_MODVERSIONS are only set when insmod passes -f, and the VT log shows
#     a plain insmod with app arguments. FORCE_LOAD therefore cannot help; with
#     FORCE_LOAD=y it would only weaken the check nobody reaches.
#   * so v14 matches the vermagic exactly, keeps every ABI-relevant CONFIG at its
#     official value, and asserts CONFIG_MODULE_FORCE_LOAD is *n*.
#
# STAGES (workflow_dispatch input `stage`)
#   0  official tree + official config only. No KSU, no SUSFS, no patch.
#      Produces a bootable package whose uname -r must be exactly
#      4.14.180-perf-gcc5ee28d3084. Ten minutes to prove the vermagic theory
#      before paying for a full SUSFS tree.
#   1  stage 0 + KernelSU v1.0.5 + inline hooks (KPROBES=n, so every hook is hand
#      inserted) + Module.symvers CRC report.
#   2  stage 1 + SUSFS v1.5.9 kernel side and KSU side + the 7 features this 4.14
#      VFS can host + Module.symvers CRC report.
#
# THIS IS A PARTIAL SUSFS - stated here so nobody is surprised later
# ---------------------------------------------------------------
# 4.14's VFS cannot host the following, and they are forced off in every stage:
#   SUS_PATH, SUS_MOUNT, OPEN_REDIRECT, SUS_SU, HAS_MAGIC_MOUNT, AUTO_ADD_*.
# They depend on >=5.4 primitives this tree does not have: lookup_slow() retry on
# an unhashed dentry, mountpoint_hashtable, ida_alloc_min(), cached-dentry
# i_state flags. Consequence: SUSFS cannot hide /data/adb/VT itself, and cannot
# hide mounts. What it can still do on 4.14: spoof uname, spoof /proc/cmdline,
# hide ksu/susfs symbols from /proc/kallsyms, try_umount for non-root uids, and
# stat/maps kstat spoofing.
#
# Toolchain (input `toolchain`) - this is the biggest remaining unknown
# -------------------------------------------------------------------
# The official banner says "clang version 10.0.6 for Android NDK". AOSP's
# prebuilts clang-r377782d reports exactly 10.0.6 (verified: AndroidVersion.txt
# in android-11.0.0_r1 says "10.0.6 based on r377782d"), and that is what the
# default `aosp` path downloads. Two notes so nobody chases the wrong tree:
#   * clang-r353983c is 9.0.3, not 10.0.6. Do not substitute it.
#   * the vendor built with NDK r21e's packaging of clang 10.0.6. The AOSP
#     prebuilt is the same compiler version but not byte-identical tooling, so a
#     4.14 tree may still need a -Wno-* nudge. Any such error appears in
#     build-baseline.log / build.log and is one sed away.
#   neutron  clang 24. Kuugo built a 4.14.336 tree with it, so it is possible,
#     but a 2019 tree needs the flag surgery already written into the build step
#     (-fcommon, the dropped -mllvm flag, the -Wno-error set).
#
# v16 fixes (20 confirmed defects, applied in four batches)
#   1. #4  baseline: payload unpack moved to step 4 so it precedes every gate;
#          config becomes step 5, gate step 6, and the whole tail shifts by one.
#   2. #4  baseline gate is now 30 inline symbols; the cmd_gate call is gone
#          (it used to always fall through to a 14-symbol fallback).
#   3. #0  check() no longer dies under `set -euo pipefail`: the grep pipeline
#          ends in a trailing fallback, the `&&` one-liner became an if, both greps get
#          2>/dev/null. Without this the first `n` expectation killed the step.
#   4. #2  build gate is stage-aware: cmd_gate only runs in stage 2, stage 1 uses
#          the same 30-symbol inline gate plus KSU=y / KSU_SUSFS=n.
#   5. #1  fs/proc/task_mmu.c gets its `#include <linux/susfs_def.h>` from the
#          yml (inside the stage-2 arm, before path_umount), then asserted.
#   6. #5  build-job unpack carries the same three SUSFS guards as baseline.
#   7. #3  step 9 check2 branches on pack_dtb instead of always demanding =n.
#   8. #7  step 9 check1 asserts the real KBUILD_DTBO_IMG rule instead of
#          claiming no dtbo.img target exists.
#   9. #15 vermagic gate records the Image size against kernel_size 41695744.
#  10. #6  stage 0 package rewrites kernel.string so it stops claiming KSU+SUSFS.
#  11. #8  the baseline toggle input is removed; symvers download, CRC report and upload
#          are unconditional (the CRC report is the only .ko-loadability gate).
#  12. #9  KSU_VERSION is derived as 10000 + commit_count + 200 and sed-ed into
#          drivers/kernelsu/Makefile, instead of the hardcoded value.
#  13. #11 KSU_MANAGER_PACKAGE is passed to make and its log line asserted.
#  14. #10 the package documents that it carries no magiskboot/busybox and
#          asserts tools/ak3-core.sh is present.
#  15. #12 anykernel.sh must keep exactly two patch_vbmeta_flag lines.
#  16. #13 `cp -r ak3_base/*` no longer swallows a missing payload directory.
#  17. #14 every artifact renamed v15 -> v16; README sentence repaired.
#  18. #16 AnyKernel3 is cloned then checked out at a pinned commit.
#  19. #17 the AOSP toolchain path asserts clang 10.x instead of only printing.
#  20. #18 the symvers joins no longer swallow failures and the sorts are LC_ALL=C,
#          so the CRC verdict cannot silently degrade to SAFE.
#
# Still unresolved on purpose (needs a decision or a real device, not a patch):
#   A. the embedded 50_add patch is generated for SUSFS v1.5.8 while susfs.h
#      says v1.5.9 - the payload is one version behind its own header.
#   B. fs/proc/task_mmu.c's missing include and the stage-1 gate are patched in
#      this yml, but the root fixes belong in the payload: fixups() should add
#      the include, and cmd_gate should take a stage argument.
#      (The old note claiming 50_add never reaches fs/namespace.c was wrong:
#       apply50 lands namespace.c #1 and #19, and verify() passes all three
#       namespace markers. The patcher also has no HOSTABLE whitelist any more.)
#
# Three things this yml cannot close, so do not read v16 as "verified working":
#   1. whether clang 10 actually compiles this 2019 tree. Unknown errors are
#      still possible; the failing log is uploaded as an artifact.
#   2. the VT driver's real vermagic / __versions. It has never been read, so
#      the target string is still an inference from the official Image. Needs
#      the tablet back.
#   3. whether the flashing environment provides magiskboot (see #10).
#
# Everything the build needs is embedded: the SUSFS v1.5.9 snapshot, the patcher,
# the official IKCONFIG dump, the AK3 script and the dtb/dtbo blobs. No build step
# fetches a patch from a third-party repository.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "0 = official only, 1 = +KernelSU, 2 = +KernelSU +SUSFS"
        required: true
        default: "0"
        type: choice
        options: ["0", "1", "2"]
      toolchain:
        description: "aosp = clang 10 (recommended) / neutron = clang 24"
        required: true
        default: "aosp"
        type: choice
        options: ["aosp", "neutron"]
      pack_dtb:
        description: "Diagnostic: also build dtbs from the tree and check they contain nabu (dtb/dtbo.img in the package stay the v0.2 blobs)"
        type: boolean
        default: false

env:
  KERNEL_REPO: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git"
  KERNEL_BRANCH: "nabu-r-oss"
  KSU_TAG: "v1.0.5"
  KSU_MANAGER_PACKAGE: "me.weishu.kernelsu"
  # KSU v1.0.5 kernel/Makefile defaults these to the official manager;
  # they are spelled out so the build log proves which manager was baked in.
  KSU_EXPECTED_HASH: "c371061b19d8c7d7d6133c6a9bafe198fa944e50c1b31c9d8daa8d7f1fc2d2d6"
  KSU_EXPECTED_SIZE: "0x033b"
  TARGET_UTS_RELEASE: "4.14.180-perf-gcc5ee28d3084"
  TARGET_VERMAGIC: "4.14.180-perf-gcc5ee28d3084 SMP preempt mod_unload modversions aarch64"
  CONFIG_SHA256: "0e881f458c4fc225f9ffec4e27b6303c8f1a34b23586ec855f8c78419909aa7f"
  PAYLOAD_SHA256: "860b2be51ccfbc3cacca8778405c7af1616950336616049e73235fa03b48a606"
  AOSP_CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r1/clang-r377782d.tar.gz"
  # AnyKernel3 HEAD at generation time (git ls-remote ... HEAD). Pinned only to
  # freeze the script the package is built against; it has NOT been validated
  # against this device. An empty value falls back to whatever HEAD is.
  AK3_COMMIT: "41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1"

# Least privilege: this workflow only reads the repo and uploads artifacts.
permissions:
  contents: read

jobs:
  # ==========================================================================
  # baseline - official tree, official config, nothing else.
  # Stage 0 uses this as the shipped artifact. Stage 1/2 use its Module.symvers
  # as the CRC reference, so the comparison is "official vs official+KSU+SUSFS"
  # instead of v13's meaningless "Kuugo vs Kuugo+addons".
  # ==========================================================================
  baseline:
    # Always run. Stage 0 ships this job's package; stage 1/2 need its
    # Module.symvers as the CRC reference. Both consumers are unconditional now,
    # so a conditional here would silently cancel `build` (needs: baseline).
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "1. host deps"
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y build-essential git zip unzip xz-utils bc flex bison \
            libssl-dev libelf-dev python3 device-tree-compiler ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: "2. toolchain"
        run: |
          set -euo pipefail
          mkdir -p tc
          if [ "${{ inputs.toolchain }}" = "neutron" ]; then
            cd tc
            curl -fsSL --retry 3 -o antman https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
            chmod +x antman
            ./antman -S
            ./antman -I
          else
            # AOSP prebuilts clang 10.0.6 == clang-r377782d. That is the exact
            # version the official banner reports, so this is the closest
            # available match to the vendor toolchain.
            curl -fsSL --retry 3 -o clang.tar.gz "$AOSP_CLANG_URL"
            mkdir -p tc
            tar -xzf clang.tar.gz -C tc
            rm -f clang.tar.gz
            test -x tc/bin/clang
            tc/bin/clang --version | head -1
          tc/bin/clang --version | grep -q 'clang version 10\.' \
            || { echo "FATAL: aosp clang is not 10.x - banner mismatch"; exit 1; }
          fi

      - name: "3. source + Makefile gate"
        run: |
          set -euo pipefail
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" src
          cd src
          echo "HEAD: $(git rev-parse HEAD)"

          # Q1: prove the checkout really is 4.14.180 before anything is built.
          V=$(awk '/^VERSION =/{print $3}' Makefile)
          P=$(awk '/^PATCHLEVEL =/{print $3}' Makefile)
          S=$(awk '/^SUBLEVEL =/{print $3}' Makefile)
          echo "Makefile says: $V.$P.$S"
          test "$V" = "4"      || { echo "FATAL: VERSION=$V"; exit 1; }
          test "$P" = "14"     || { echo "FATAL: PATCHLEVEL=$P"; exit 1; }
          test "$S" = "180"    || { echo "FATAL: SUBLEVEL=$S"; exit 1; }

          test -f arch/arm64/configs/nabu_user_defconfig || { echo "FATAL: nabu_user_defconfig missing"; exit 1; }
          echo "nabu_user_defconfig: $(wc -c < arch/arm64/configs/nabu_user_defconfig) bytes"

      - name: "4. unpack the embedded toolkit"
        run: |
          set -euo pipefail
          # payload.tar.xz is a repo asset now: a 195 KB base64 heredoc blows
          # GitHub's 21000-char limit on a single run block (HTTP 422 at dispatch).
          curl -fsSL --retry 3 -o payload.tar.xz \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/assets/payload.tar.xz"
          test "$(sha256sum payload.tar.xz | cut -d' ' -f1)" = "$PAYLOAD_SHA256" \
            || { echo "FATAL: payload hash mismatch"; exit 1; }
          tar -xJf payload.tar.xz
          rm -f payload.tar.xz
          python3 -c "import ast;ast.parse(open('nabu_patch.py').read());print('patcher ok')"

          # D1-style guard: exactly one SUSFS version, TIF scheme, no v1.5.5 leftovers
          VER=$(grep -E '^#define SUSFS_VERSION' kernel_patches/include/linux/susfs.h | cut -d'"' -f2)
          echo "SUSFS_VERSION      : $VER"
          test "$VER" = "v1.5.9" || { echo "FATAL: want v1.5.9 got $VER"; exit 1; }
          grep -q 'TIF_NON_ROOT_USER_APP_PROC' kernel_patches/include/linux/susfs_def.h \
            || { echo "FATAL: TIF scheme missing"; exit 1; }
          if grep -rq 'susfs_task_state' kernel_patches/; then
            echo "FATAL: v1.5.5 task_struct scheme leaked in"; exit 1
          fi
          echo "payload: one v1.5.9 snapshot, TIF scheme, no struct growth"

      - name: "5. official config (IKCONFIG dump) + ABI lock"
        run: |
          set -euo pipefail
          # Q2: the config comes from the *shipped boot.img* (IKCONFIG), not from
          # nabu_user_defconfig. Reason: the defconfig is the vendor's *request*
          # (778 symbols); the extracted config is what the running kernel
          # actually has (5036 symbols, and every genksyms input already frozen).
          # Building from the defconfig would let olddefconfig pick defaults for
          # ~4000 symbols, and one of them could move a CRC. The extracted config
          # is used verbatim; the only deliberate edits are the four below.
          mkdir -p src/out
          # same reason as the payload block: this heredoc was 51 KB.
          curl -fsSL --retry 3 -o official.config.gz \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/assets/official.config.gz"
          gunzip -f official.config.gz
          test "$(sha256sum official.config | cut -d' ' -f1)" = "$CONFIG_SHA256" \
            || { echo "FATAL: extracted config hash mismatch"; exit 1; }
          echo "config lines: $(wc -l < official.config)"
          head -4 official.config
          cp official.config src/out/.config

          cd src
          # Q3: pin UTS_RELEASE. .scmversion makes scripts/setlocalversion emit
          # exactly CONFIG_LOCALVERSION and nothing else, which is the only way
          # to get a byte-exact "-perf-gcc5ee28d3084".
          #
          # Why CONFIG_LOCALVERSION="-perf-gcc5ee28d3084" and not "-perf":
          # the official config has CONFIG_LOCALVERSION_AUTO=y, so
          # setlocalversion appends -g<short-hash> (or -dirty) *after*
          # CONFIG_LOCALVERSION. In a --depth=1 clone git describe has no tag, so
          # that suffix degrades to "-g<sha>" of an arbitrary commit; in a
          # tarball checkout it is not reproducible at all. Writing .scmversion
          # is what stops it, and once .scmversion exists the value of
          # CONFIG_LOCALVERSION is the whole version string.
          printf '' > .scmversion
          S="scripts/config --file out/.config"
          $S --set-str LOCALVERSION "-perf-gcc5ee28d3084"
          $S --disable LOCALVERSION_AUTO

          # The ABI lock. Every one of these already has the wanted value in the
          # extracted config; they are re-asserted so a future edit to this yml
          # that flips one is visible in the gate instead of silently shipping.
          $S --enable  MODULES
          $S --enable  MODULE_UNLOAD
          $S --enable  MODVERSIONS
          $S --disable MODULE_SIG
          $S --disable MODULE_FORCE_LOAD
          $S --disable MODULE_FORCE_UNLOAD
          $S --disable KPROBES
          $S --enable  OVERLAY_FS
          $S --enable  SDCARD_FS
          $S --disable WERROR || true

          # dtb: pack_dtb=true turns on CONFIG_BUILD_ARM64_DT_OVERLAY, which is what
          # gates the dtbo/dtb rules. The rule DOES exist in this tree:
          # arch/arm64/Makefile L187 defines KBUILD_DTBO_IMG := dtbo.img and
          # L223-231 define $(KBUILD_DTBO_IMG): dtbs inside the same ifeq, so with the
          # symbol unset (the official config) it simply never fires. dtb and dtbo.img
          # therefore always ship from the v0.2 package.
          if [ "${{ inputs.pack_dtb }}" = "true" ]; then
            $S --enable BUILD_ARM64_DT_OVERLAY
          fi

          make ARCH=arm64 SUBARCH=arm64 O=out olddefconfig

      - name: "6. GATE - ABI config unchanged (30 ABI-locked symbols)"
        run: |
          set -euo pipefail
          cd src
          # This step deliberately does NOT call `nabu_patch.py gate`. cmd_gate
          # (patcher L944-1015) demands CONFIG_KSU=y AND CONFIG_KSU_SUSFS=y at
          # L960-965 with no stage condition, so it can only ever pass in stage 2.
          # The inline gate below checks the 30 ABI symbols and nothing else,
          # which is exactly what a baseline (no KSU) or stage-1 build needs.
          #
          # check() must stay byte-identical to the stage-1 copy in the build job.
          fail=0
          check() { # name want
            got=$(grep -E "^$1=" out/.config 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' || true)
            if [ -z "$got" ]; then
              if grep -q "^# $1 is not set" out/.config 2>/dev/null; then got=n; else got='<absent>'; fi
            fi
            if [ "$got" = "$2" ]; then
              printf '  %-34s want=%-6s got=%-8s OK\n' "$1" "$2" "$got"
            else
              printf '  %-34s want=%-6s got=%-8s FAIL\n' "$1" "$2" "$got"; fail=1
            fi
          }
          check CONFIG_MODULES y
          check CONFIG_MODULE_UNLOAD y
          check CONFIG_MODULE_SIG n
          check CONFIG_MODULE_FORCE_LOAD n
          check CONFIG_MODULE_FORCE_UNLOAD n
          check CONFIG_MODVERSIONS y
          check CONFIG_MODULES_USE_ELF_RELA y
          check CONFIG_TRACEPOINTS y
          check CONFIG_EVENT_TRACING y
          check CONFIG_FTRACE y
          check CONFIG_FUNCTION_TRACER n
          check CONFIG_KPROBES n
          check CONFIG_JUMP_LABEL n
          check CONFIG_KALLSYMS y
          check CONFIG_KALLSYMS_ALL y
          check CONFIG_ARM64_MODULE_PLTS y
          check CONFIG_ARM64_4K_PAGES y
          check CONFIG_ARM64_VA_BITS 39
          check CONFIG_PREEMPT y
          check CONFIG_SMP y
          check CONFIG_STRICT_MODULE_RWX y
          check CONFIG_RANDOMIZE_BASE y
          check CONFIG_SDCARD_FS y
          check CONFIG_OVERLAY_FS y
          check CONFIG_USER_NS n
          check CONFIG_PID_NS n
          check CONFIG_PROC_KCORE n
          check CONFIG_DEVMEM n
          check CONFIG_TRIM_UNUSED_KSYMS n
          check CONFIG_THREAD_INFO_IN_TASK y
          [ $fail = 0 ] || { echo "FATAL: ABI config drifted"; exit 1; }

          # Q3 continued: assert kernelrelease before wasting 40 minutes of build.
          KR=$(make -s ARCH=arm64 SUBARCH=arm64 O=out kernelrelease)
          echo "make kernelrelease: $KR"
          test "$KR" = "$TARGET_UTS_RELEASE" \
            || { echo "FATAL: kernelrelease '$KR' != '$TARGET_UTS_RELEASE'"; exit 1; }

      - name: "6b. stub for the symbol the OSS drop forgot"
        run: |
          set -euo pipefail
          # input.c:449 calls touch_press_release_events_collect() whenever
          # CONFIG_LAST_TOUCH_EVENTS=y, and the official IKCONFIG dump DOES set it.
          # The implementation is NOT in nabu-r-oss: drivers/input/Makefile has no
          # obj- line for it and no source file defines it, so vmlinux dies at link
          # with "undefined symbol: touch_press_release_events_collect".
          # Provide a no-op body. It defines no struct and changes no type, so no
          # genksyms CRC can move and the config stays byte-identical to official.
          cd src
          cat > drivers/input/last_touch_events_stub.c <<'STUBEOF'
          #include <linux/kernel.h>
          #include <linux/input.h>

          /*
           * Body intentionally empty: the vendor's real implementation was never
           * published. A module's loadability depends on vermagic and symbol CRCs,
           * not on what this function does at runtime.
           */
          void touch_press_release_events_collect(struct input_dev *dev,
                                                  unsigned int type,
                                                  unsigned int code,
                                                  int value)
          {
          }
          STUBEOF
          grep -q 'last_touch_events_stub' drivers/input/Makefile \
            || echo 'input-core-y += last_touch_events_stub.o' >> drivers/input/Makefile
          grep 'last_touch_events_stub' drivers/input/Makefile
          test -f drivers/input/last_touch_events_stub.c
          echo "stub installed for touch_press_release_events_collect"

          # selinux hooks.c marks selinux_enforcing_boot __rticdata, parking it in
          # .bss.rtic. arch/arm64/kernel/vmlinux.lds.S only emits
          # KEEP(*(.bss.rtic)) inside a nested .bss block that the enclosing .bss
          # evicts, so the variable lands outside the +/-1MB ADRP window and the
          # link dies: relocation truncated to fit ... against '.bss.rtic'
          # Dropping the attribute only changes which section the int lives in.
          # It is a plain static int, exported to no module, so no CRC can move.
          sed -i 's/selinux_enforcing_boot __rticdata/selinux_enforcing_boot/' security/selinux/hooks.c
          grep -n 'selinux_enforcing_boot' security/selinux/hooks.c | head -3
          if grep -q '__rticdata' security/selinux/hooks.c; then
            echo "FATAL: __rticdata still present"; exit 1
          fi
          echo "rtic attribute stripped from selinux_enforcing_boot"

      - name: "7. build Image (+ Module.symvers)"
        run: |
          set -euo pipefail
          export PATH="$PWD/tc/bin:$PATH"
          # lld does the final link. An earlier run switched to GNU bfd because
          # lld 10 died with "output file too large: 18446743524396893... bytes"
          # (a negative offset read as unsigned) - but that was the same .bss.rtic
          # layout bug the stub step now strips. bfd is not an option anyway: it
          # produces a layout kallsyms rejects with "relative symbol value ...
          # out of range in relative mode" under CONFIG_KALLSYMS_BASE_RELATIVE=y.
          cd src
          if [ "${{ inputs.toolchain }}" = "neutron" ]; then
            # Route B: clang 24 against a 2019 tree. Known breakages and the
            # minimal surgery that keeps them from reaching the compiler.
            echo "== neutron fixups =="
            # -fno-common became the default in GCC 10 / clang 11; 4.14 relies on
            # tentative definitions merging. Re-enable the old behaviour.
            echo "KBUILD_CFLAGS += -fcommon" >> Makefile
            # -mllvm flags the tree passes were renamed or dropped. cc-option
            # already filters unsupported ones, but the unconditional ones in
            # Makefile.core are not; strip them.
            sed -i 's/^KBUILD_CFLAGS += $(call cc-option, -mllvm -disable-struct-const-merge).*$/# dropped for clang 24 (flag removed)/' Makefile
            # Newer clang promotes a pile of pre-C99 diagnostics to errors.
            echo "KBUILD_CFLAGS += -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-unused-but-set-variable" >> Makefile
            export KCFLAGS="-w -Wno-error -fcommon"
          else
            export KCFLAGS="-w -Wno-error"
          fi

          make ARCH=arm64 SUBARCH=arm64 O=out \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LOCALVERSION= \
            -j"$(nproc --all)" Image > ../build-baseline.log 2>&1 || {
              rc=$?
              echo "make failed rc=$rc"
              grep -nE "error:|Error [0-9]|undefined reference" ../build-baseline.log | head -60 || true
              tail -150 ../build-baseline.log
              exit $rc
            }
          ls -lh out/arch/arm64/boot/Image

          # `make Image` never runs modpost, so out/Module.symvers does NOT exist
          # yet: arch/arm64/Makefile L187 is `Image: vmlinux`, and the modpost call
          # is top-level Makefile L1446 under `modules:`. Build the module tree to
          # get the symvers baseline stage 1/2 compares against - non-fatally,
          # because stage 0 exists to prove the vermagic and a module that refuses
          # to compile must not hide a good Image.
          make ARCH=arm64 SUBARCH=arm64 O=out \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LOCALVERSION= \
            -j"$(nproc --all)" modules >> ../build-baseline.log 2>&1 \
            || echo "WARNING: modules target failed - continuing without Module.symvers"
          if [ -f out/Module.symvers ]; then
            echo "Module.symvers entries: $(wc -l < out/Module.symvers)"
          else
            echo "WARNING: out/Module.symvers absent - stage 1/2 CRC baseline unavailable"
          fi

      - name: "8. GATE - vermagic byte check + kernel size record (Q4)"
        run: |
          set -euo pipefail
          cd src
          IMG=out/arch/arm64/boot/Image
          BANNER=$(strings -a "$IMG" | grep -m1 '^Linux version ' || true)
          echo "Image banner : ${BANNER:-<none>}"
          test -n "$BANNER" || { echo "FATAL: no Linux version string in Image"; exit 1; }

          UTS=$(echo "$BANNER" | awk '{print $3}')
          echo "UTS_RELEASE  : $UTS"

          # Rebuild the exact vermagic string module.c will compare against.
          # include/linux/vermagic.h orders it as:
          #   UTS_RELEASE " " SMP PREEMPT MODULE_UNLOAD MODVERSIONS ARCH
          REBUILT="$UTS SMP preempt mod_unload modversions aarch64"
          echo "rebuilt      : $REBUILT"
          echo "target       : $TARGET_VERMAGIC"
          echo "$REBUILT" > ../vermagic.txt

          if [ "$UTS" != "$TARGET_UTS_RELEASE" ]; then
            echo "FATAL: UTS_RELEASE '$UTS' != '$TARGET_UTS_RELEASE'"
            echo "       check CONFIG_LOCALVERSION, .scmversion and that LOCALVERSION_AUTO is off"
            exit 1
          fi
          if [ "$REBUILT" != "$TARGET_VERMAGIC" ]; then
            echo "FATAL: vermagic '$REBUILT' != '$TARGET_VERMAGIC'"
            exit 1
          fi

          # Independent confirmation: the literal string must be findable inside
          # the image, because the out-of-tree driver carries it in .modinfo and
          # the kernel compares against its own copy.
          if strings -a "$IMG" | grep -qxF "$TARGET_UTS_RELEASE"; then
            echo "UTS_RELEASE found as a standalone string: yes"
          else
            echo "NOTE: UTS_RELEASE not standalone in Image (compiled into vermagic blobs); banner+rebuild check stands"
          fi
          # The official boot.img header v3 carries kernel_size=41695744 and that
          # kernel segment is a BARE Image, not Image-dtb: the banner sits at
          # 18354191 and the vermagic at 18408792 inside a 41695744-byte segment,
          # which only fits an uncompressed Image. So `make Image` is the correct
          # target here. Do NOT switch to Image.gz-dtb even though the config has
          # CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y - that setting only makes
          # KBUILD_TARGET Image-dtb for the `all` target, which this workflow
          # never builds.
          IMGSZ=$(wc -c < out/arch/arm64/boot/Image)
          echo "Image size: $IMGSZ (official boot.img kernel_size = 41695744)"
          if [ "$IMGSZ" -gt 60000000 ] || [ "$IMGSZ" -lt 20000000 ]; then
            echo "WARNING: Image size far from official range - verify before flashing"
          fi
          echo "vermagic gate: PASS"
          cp "$IMG" ../Image.stage0

      - name: "9. dtb diagnostic - why dtbo.img is never rebuilt (Q: dtbo target)"
        run: |
          set -euo pipefail
          # Reality check on this tree, which the v16 comment got wrong:
          # nabu-r-oss does NOT define KBUILD_DTBO_IMG at all. arch/arm64/Makefile
          # only has KBUILD_DTBS := dtbs, a `dtbs:` rule, and Image-dtb/Image.gz-dtb.
          # CONFIG_BUILD_ARM64_DT_OVERLAY controls nothing but DTC_FLAGS := -@.
          # So there is no way to build dtbo.img from this tree even in principle -
          # dtbo.img always ships from the v0.2 blob, which is what we already do.
          echo "--- check 1: this tree has no dtbo.img target (expected) ---"
          if grep -qE 'KBUILD_DTBO_IMG|^\$\(KBUILD_DTBO_IMG\)' src/arch/arm64/Makefile; then
            echo "NOTE: KBUILD_DTBO_IMG appeared - a dtbo.img target may now exist"
          else
            echo "confirmed: no KBUILD_DTBO_IMG in arch/arm64/Makefile, dtbo.img is never built here"
          fi
          echo "--- check 1b: the dtbs target does exist ---"
          grep -qE '^dtbs:' src/arch/arm64/Makefile \
            || { echo "FATAL: dtbs target missing, unexpected tree"; exit 1; }
          echo "confirmed: dtbs target present"

          echo "--- check 2: BUILD_ARM64_DT_OVERLAY matches the pack_dtb input ---"
          if [ "${{ inputs.pack_dtb }}" = "true" ]; then
            grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y' src/out/.config \
              || { echo "FATAL: pack_dtb=true but DT_OVERLAY not enabled"; exit 1; }
            echo "confirmed: overlay dtb build is enabled (pack_dtb=true)"
          else
            grep -q '^# CONFIG_BUILD_ARM64_DT_OVERLAY is not set' src/out/.config \
              || { echo "FATAL: DT_OVERLAY unexpectedly set"; exit 1; }
            echo "confirmed: overlay dtb build is disabled (pack_dtb=false)"
          fi

          if [ "${{ inputs.pack_dtb }}" = "true" ]; then
            echo "--- diagnostic: building dtbs ---"
            export PATH="$PWD/tc/bin:$PATH"
          # lld does the final link. An earlier run switched to GNU bfd because
          # lld 10 died with "output file too large: 18446743524396893... bytes"
          # (a negative offset read as unsigned) - but that was the same .bss.rtic
          # layout bug the stub step now strips. bfd is not an option anyway: it
          # produces a layout kallsyms rejects with "relative symbol value ...
          # out of range in relative mode" under CONFIG_KALLSYMS_BASE_RELATIVE=y.
            ( cd src && make ARCH=arm64 SUBARCH=arm64 O=out \
                CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
                OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
                CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                KCFLAGS="-w -Wno-error" -j"$(nproc --all)" dtbs ) >> build-baseline.log 2>&1
            mkdir -p dtb-diagnostic
            find src/out -name '*.dtb' -exec cp {} dtb-diagnostic/ \; 2>/dev/null || true
            N=$(ls dtb-diagnostic 2>/dev/null | wc -l)
            echo "dtbs produced: $N"
            if [ "$N" = "0" ]; then
              echo "note: dtbs produced no .dtb; the tree does not build DT for this config"
            fi
            # A tree-built dtb must at least mention nabu, otherwise it is a
            # generic SM8150 blob and must never reach a device.
            if ls dtb-diagnostic/*.dtb >/dev/null 2>&1; then
              if strings -a dtb-diagnostic/*.dtb | grep -qi 'nabu'; then
                echo "at least one tree-built dtb mentions nabu"
              else
                echo "WARNING: no tree-built dtb mentions nabu - do not flash these"
              fi
            fi
          else
            echo "pack_dtb=false: dtb/dtbo.img come from the v0.2 blobs"
          fi
          # the shipped blobs are always the working v0.2 ones
          ls -l ak3_base/dtb ak3_base/dtbo.img
          python3 - <<'PY'
          d = open('ak3_base/dtb','rb').read(4)
          o = open('ak3_base/dtbo.img','rb').read(4)
          assert d == b'\xd0\x0d\xfe\xed', ('dtb is not an FDT blob', d)
          assert o[0] == 0xd7 and o[1] == 0xb7, ('dtbo.img is not a dt_table', o)
          print('ak3_base/dtb      : FDT magic OK')
          print('ak3_base/dtbo.img : dt_table magic OK')
          PY

      - name: "10. pack stage 0 (official kernel, no root, no SUSFS)"
        run: |
          set -euo pipefail
          test -d ak3_base || { echo "FATAL: payload did not produce ak3_base/"; exit 1; }
          cp -r ak3_base/* .
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          if [ -n "${AK3_COMMIT:-}" ]; then
            git -C ak3 checkout --detach "$AK3_COMMIT" \
              || { echo "WARNING: AK3_COMMIT checkout failed, staying on HEAD"; }
          else
            echo "WARNING: AK3_COMMIT empty, using HEAD"
          fi
          git -C ak3 rev-parse HEAD > AK3_COMMIT.txt
          rm -rf ak3/.git ak3/Image* ak3/dtb ak3/modules ak3/patch
          # The upstream clone only ships tools/ak3-core.sh; the packaged binary
          # helpers of the v0.2 zip are NOT rebuilt here on purpose. See the
          # README note written below for what the flasher must provide.
          test -f ak3/tools/ak3-core.sh || { echo "FATAL: ak3-core.sh missing"; exit 1; }
          cp Image.stage0 ak3/Image
          cp ak3_base/dtb ak3/dtb
          cp ak3_base/dtbo.img ak3/dtbo.img
          cp anykernel.sh ak3/anykernel.sh
          # The payload script is structurally the v0.2 script. Its boot section
          # additionally carries patch_vbmeta_flag=auto, which AK3 ak3-core.sh
          # treats identically to leaving it unset (auto/empty preserves whatever
          # dump_boot decided). So expect exactly two occurrences: boot +
          # vendor_boot.
          sed -i "s|kernel.string=.*|kernel.string=nabu stage 0 (official 4.14.180, no root, no SUSFS)|" ak3/anykernel.sh
          grep -q 'kernel.string=nabu stage 0' ak3/anykernel.sh \
            || { echo "FATAL: stage 0 kernel.string not rewritten"; exit 1; }
          N_VBMETA=$(grep -c 'patch_vbmeta_flag=auto' ak3/anykernel.sh)
          [ "$N_VBMETA" = "2" ] \
            || { echo "FATAL: expected 2 patch_vbmeta_flag lines (boot+vendor_boot), got $N_VBMETA"; exit 1; }
          echo "anykernel.sh: stage 0 string set, 2 patch_vbmeta_flag lines present"
          cd ak3
          zip -r9 ../nabu-v16-s0.zip . -x '*.git*' >/dev/null
          cd ..
          sha256sum nabu-v16-s0.zip
          unzip -l nabu-v16-s0.zip | grep -E 'Image|dtb|anykernel.sh|ak3-core'

      - uses: actions/upload-artifact@v4
        with:
          name: nabu-v16-s0
          path: |
            nabu-v16-s0.zip
            vermagic.txt
            AK3_COMMIT.txt
          if-no-files-found: error

      - name: "11. export baseline Module.symvers for stage 1/2"
        uses: actions/upload-artifact@v4
        with:
          name: baseline-symvers
          path: src/out/Module.symvers
          # warn, not error: stage 0's deliverable is the Image+zip. If the module
          # tree did not compile, stage 1 will fail loudly at step 13 instead.
          if-no-files-found: warn

      - name: "12. build log on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-build-log
          path: build-baseline.log
          if-no-files-found: warn

  # ==========================================================================
  # build - stage 1 and 2. Needs the baseline symvers, so it is gated on
  # needs: baseline (v13's parallel jobs raced here and the download failed).
  # ==========================================================================
  build:
    needs: baseline
    # stage 0 is complete after baseline; 1/2 add KSU/SUSFS on top.
    if: ${{ inputs.stage != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: "1. host deps"
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y build-essential git zip unzip xz-utils bc flex bison \
            libssl-dev libelf-dev python3 device-tree-compiler ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: "2. toolchain"
        run: |
          set -euo pipefail
          mkdir -p tc
          if [ "${{ inputs.toolchain }}" = "neutron" ]; then
            cd tc
            curl -fsSL --retry 3 -o antman https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
            chmod +x antman
            ./antman -S
            ./antman -I
          else
            curl -fsSL --retry 3 -o clang.tar.gz "$AOSP_CLANG_URL"
            tar -xzf clang.tar.gz -C tc
            rm -f clang.tar.gz
            test -x tc/bin/clang
            tc/bin/clang --version | head -1
          tc/bin/clang --version | grep -q 'clang version 10\.' \
            || { echo "FATAL: aosp clang is not 10.x - banner mismatch"; exit 1; }
          fi

      - name: "3. unpack the embedded toolkit"
        run: |
          set -euo pipefail
          # payload.tar.xz is a repo asset now: a 195 KB base64 heredoc blows
          # GitHub's 21000-char limit on a single run block (HTTP 422 at dispatch).
          curl -fsSL --retry 3 -o payload.tar.xz \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/assets/payload.tar.xz"
          test "$(sha256sum payload.tar.xz | cut -d' ' -f1)" = "$PAYLOAD_SHA256" \
            || { echo "FATAL: payload hash mismatch"; exit 1; }
          tar -xJf payload.tar.xz
          rm -f payload.tar.xz
          python3 -c "import ast;ast.parse(open('nabu_patch.py').read());print('patcher ok')"

          # Same guards as the baseline unpack step. Both payload blocks are the
          # same archive (sha256 verified above), so this cannot disagree.
          VER=$(grep -E '^#define SUSFS_VERSION' kernel_patches/include/linux/susfs.h | cut -d'"' -f2)
          echo "SUSFS_VERSION      : $VER"
          test "$VER" = "v1.5.9" || { echo "FATAL: want v1.5.9 got $VER"; exit 1; }
          grep -q 'TIF_NON_ROOT_USER_APP_PROC' kernel_patches/include/linux/susfs_def.h \
            || { echo "FATAL: TIF scheme missing"; exit 1; }
          if grep -rq 'susfs_task_state' kernel_patches/; then
            echo "FATAL: v1.5.5 task_struct scheme leaked in"; exit 1
          fi
          echo "payload: one v1.5.9 snapshot, TIF scheme, no struct growth"

      - name: "4. KernelSU v1.0.5"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o ksu.zip "https://codeload.github.com/tiann/KernelSU/zip/refs/tags/${KSU_TAG}"
          unzip -q ksu.zip
          mv "KernelSU-${KSU_TAG#v}" ksu-src
          test -f ksu-src/kernel/core_hook.c
          test -f ksu-src/kernel/sucompat.c
          echo "KernelSU ${KSU_TAG} kernel tree ready"

          # The codeload zip has no .git, so kernel/Makefile takes its else branch
          # and hardcodes a literal KSU_VERSION value (L29). ksu.h L7 reports
          # that number to the manager. The real formula in the Makefile is
          # KSU_VERSION = 10000 + git_commit_count + 200, so derive the count from
          # the GitHub API and substitute it in step 7.
          KSU_COUNT=""
          for i in 1 2 3; do
            KSU_COUNT=$(curl -sI "https://api.github.com/repos/tiann/KernelSU/commits?sha=v1.0.5&per_page=1" \
              | tr -d '\r' | grep -i '^link:' | sed 's/.*page=\([0-9]*\)>; rel="last".*/\1/' || true)
            case "$KSU_COUNT" in
              ''|*[!0-9]*) sleep 3; KSU_COUNT="" ;;
              *) break ;;
            esac
          done
          if [ -z "$KSU_COUNT" ]; then
            # Conservative floor, only to keep the build alive when the API is
            # unreachable or rate limited (NEEDS CONFIRMATION against a real tag).
            KSU_COUNT=2800
            echo "WARNING: KSU commit count lookup failed, fallback count=$KSU_COUNT"
          fi
          KSU_VER=$((10000 + KSU_COUNT + 200))
          echo "KSU_VERSION -> $KSU_VER (count=$KSU_COUNT, formula=10000+count+200)"
          echo "KSU_VER=$KSU_VER" >> "$GITHUB_ENV"

      - name: "5. kernel source + Makefile gate"
        run: |
          set -euo pipefail
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel-source
          cd kernel-source
          V=$(awk '/^VERSION =/{print $3}' Makefile)
          P=$(awk '/^PATCHLEVEL =/{print $3}' Makefile)
          S=$(awk '/^SUBLEVEL =/{print $3}' Makefile)
          echo "Makefile says: $V.$P.$S"
          test "$V$P$S" = "414180" || { echo "FATAL: not 4.14.180"; exit 1; }

      - name: "6. KernelSU side - 10_enable + wiring"
        run: |
          set -euo pipefail
          # 10_enable_susfs_for_ksu.patch is written against exactly tiann
          # v1.0.5: 64/64 hunks land. Against KSU-Next it is 2-3/44, which is
          # why v14 pins v1.0.5 and not a newer fork.
          python3 nabu_patch.py apply10 ksu-src kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          python3 nabu_patch.py ksuside ksu-src
          if [ "${{ inputs.stage }}" = "2" ]; then
            python3 nabu_patch.py compat ksu-src
          else
            # stage 1 also needs the 4.14 compat shims: MODULE_IMPORT_NS and
            # strncpy_from_user_nofault do not exist in this tree at all.
            python3 nabu_patch.py compat ksu-src
          fi

          # sepolicy.c in v1.0.5 is written for >=5.9 SELinux internals. Two
          # functions there reference struct filename_trans_key,
          # policydb_filenametr_search(), the datum stypes ebitmap, trans->next,
          # a 4-argument hashtab_insert() and db->type_val_to_struct as a **
          # array - none of which 4.14 has, and upstream puts no version guard
          # around them. The stage 2 build died on exactly those 15 errors.
          # Both are only reachable at runtime via ksud's sepolicy ioctl
          # (core_hook.c -> ksu_handle_sepolicy), so on 4.14 they degrade to a
          # no-op; no exported symbol, no CRC and no module ABI is affected.
          python3 nabu_patch.py sepolicy14 ksu-src

          # rules.c reads the policydb via selinux_state.policy, which only exists
          # from 5.7. 4.14 keeps it in selinux_state.ss -> selinux_ss.policydb.
          # Same pointer, same rules; nothing exported changes.
          python3 nabu_patch.py rules14 ksu-src
          echo "=== KSU markers ==="
          grep -c 'susfs_init'                     ksu-src/kernel/ksu.c             || true
          grep -c 'config KSU_SUSFS'               ksu-src/kernel/Kconfig           || true
          grep -c 'susfs_is_current_ksu_domain'    ksu-src/kernel/selinux/selinux.c || true

      - name: "7. install KernelSU + the single SUSFS snapshot"
        run: |
          set -euo pipefail
          rm -rf kernel-source/drivers/kernelsu
          cp -r ksu-src/kernel kernel-source/drivers/kernelsu

          # Replace the Makefile's hardcoded numeric -DKSU_VERSION with the
          # derived value (KSU_VER comes from the download step via $GITHUB_ENV).
          # The sed matches any digit run so it does not depend on the default
          # the upstream Makefile happens to ship.
          sed -i "s/-DKSU_VERSION=[0-9][0-9]*/-DKSU_VERSION=${KSU_VER}/" kernel-source/drivers/kernelsu/Makefile
          grep -q "DKSU_VERSION=${KSU_VER}" kernel-source/drivers/kernelsu/Makefile \
            || { echo "FATAL: KSU_VERSION sed failed (want ${KSU_VER})"; exit 1; }
          echo "kernel KSU_VERSION -> ${KSU_VER}"

          python3 nabu_patch.py wiring kernel-source
          python3 nabu_patch.py wiringcheck kernel-source

          if [ "${{ inputs.stage }}" = "2" ]; then
            cp kernel_patches/fs/susfs.c                kernel-source/fs/susfs.c
            cp kernel_patches/fs/sus_su.c               kernel-source/fs/sus_su.c
            cp kernel_patches/include/linux/susfs.h     kernel-source/include/linux/susfs.h
            cp kernel_patches/include/linux/susfs_def.h kernel-source/include/linux/susfs_def.h
            cp kernel_patches/include/linux/sus_su.h    kernel-source/include/linux/sus_su.h
            echo "SUSFS v1.5.9 sources staged"
          else
            echo "stage 1: no SUSFS sources (KernelSU only)"
          fi

      - name: "8. kernel side - 50_add, fixups, path_umount, inline hooks"
        run: |
          set -euo pipefail
          cd kernel-source
          if [ "${{ inputs.stage }}" = "2" ]; then
            # 50_add against the official tree: 5 hunks apply by context, 90 are
            # deliberately skipped (they insert code that lives entirely inside
            # #ifdef CONFIG_KSU_SUSFS_{SUS_PATH,SUS_MOUNT,OPEN_REDIRECT,SUS_SU}
            # which stay =n), and 4 files cannot be matched at all because the
            # fork this patch was written on differs - those go through
            # fixups() with anchor-exact edits verified against nabu-r-oss.
            python3 ../nabu_patch.py apply50 . ../kernel_patches/50_add_susfs_in_kernel-4.14.patch
            python3 ../nabu_patch.py fixups .

            # N0: 50_add hunk#1 for fs/proc/task_mmu.c is nothing but
            #   #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
            #   #include <linux/susfs_def.h>
            #   #endif
            # and apply50 skips that file entirely (it is in HAND_FIXED), while
            # fixups() only adds the extern declaration and the call site. With
            # CONFIG_KSU_SUSFS_SUS_KSTAT=y the code then references
            # INODE_STATE_SUS_KSTAT (susfs_def.h L56) with no declaration ->
            # compile error. The include is inserted here instead, because the
            # patcher lives inside the base64 payload and cannot be edited here.
            #
            # The heredoc body and its PY terminator sit at this step's base
            # indent on purpose: bash only ends a <<'PY' document on a line that
            # is exactly PY, so indenting it into the if-arm would break parsing.
          python3 - <<'PY'
          p = 'fs/proc/task_mmu.c'
          s = open(p).read()
          if 'linux/susfs_def.h' not in s:
              anchor = '#include <linux/ctype.h>'
              assert anchor in s, 'task_mmu.c anchor missing'
              s = s.replace(anchor,
                  anchor + '\n#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif', 1)
              open(p, 'w').write(s)
              print('task_mmu.c: susfs_def.h include inserted')
          else:
              print('task_mmu.c: susfs_def.h already present')
          PY
            grep -q 'linux/susfs_def.h' fs/proc/task_mmu.c \
              || { echo "FATAL: task_mmu.c missing susfs_def.h include"; exit 1; }
          fi
          # path_umount is required by core_hook.c in every stage, so it is not
          # inside the stage 2 branch.
          python3 ../nabu_patch.py umount .
          python3 ../nabu_patch.py hooks .

      - name: "9. config"
        run: |
          set -euo pipefail
          # same reason as the payload block: this heredoc was 51 KB.
          curl -fsSL --retry 3 -o official.config.gz \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/assets/official.config.gz"
          gunzip -f official.config.gz
          test "$(sha256sum official.config | cut -d' ' -f1)" = "$CONFIG_SHA256" \
            || { echo "FATAL: config hash mismatch"; exit 1; }

          cd kernel-source
          mkdir -p out
          cp ../official.config out/.config
          printf '' > .scmversion
          S="scripts/config --file out/.config"
          $S --set-str LOCALVERSION "-perf-gcc5ee28d3084"
          $S --disable LOCALVERSION_AUTO

          # ABI lock - see the header comment. Do not touch.
          $S --enable  MODULES
          $S --enable  MODULE_UNLOAD
          $S --enable  MODVERSIONS
          $S --disable MODULE_SIG
          $S --disable MODULE_FORCE_LOAD
          $S --disable MODULE_FORCE_UNLOAD
          $S --disable KPROBES
          $S --disable KPROBE_EVENTS || true
          $S --enable  OVERLAY_FS
          $S --enable  SDCARD_FS
          $S --disable WERROR || true

          # root, built in: non-GKI cannot load KSU as a module
          $S --enable  KSU
          $S --disable KSU_DEBUG

          if [ "${{ inputs.stage }}" = "2" ]; then
            # Only the features this 4.14 VFS can host.
            $S --enable  KSU_SUSFS
            $S --enable  KSU_SUSFS_SUS_KSTAT
            $S --enable  KSU_SUSFS_TRY_UMOUNT
            $S --enable  KSU_SUSFS_SPOOF_UNAME
            $S --enable  KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            $S --enable  KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            $S --enable  KSU_SUSFS_ENABLE_LOG
            # Off by design: >=5.4 VFS required. Enabling any of these will not
            # compile on 4.14, and the yml previously claimed they worked.
            $S --disable KSU_SUSFS_SUS_PATH
            $S --disable KSU_SUSFS_SUS_MOUNT
            $S --disable KSU_SUSFS_OPEN_REDIRECT
            $S --disable KSU_SUSFS_SUS_SU
            $S --disable KSU_SUSFS_HAS_MAGIC_MOUNT
            $S --disable KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
            $S --disable KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
            $S --disable KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          fi

          if [ "${{ inputs.pack_dtb }}" = "true" ]; then
            $S --enable BUILD_ARM64_DT_OVERLAY
          fi

          make ARCH=arm64 SUBARCH=arm64 O=out olddefconfig

      - name: "10. GATE - ABI config per stage (baseline gate + KSU expectations)"
        run: |
          set -euo pipefail
          cd kernel-source
          if [ "${{ inputs.stage }}" = "2" ]; then
            # stage 2 is the only stage where cmd_gate is valid: it checks the
            # 30 ABI symbols AND demands CONFIG_KSU=y + CONFIG_KSU_SUSFS=y.
            python3 ../nabu_patch.py gate .
            grep -q '^CONFIG_KSU_SUSFS=y' out/.config || { echo "FATAL: KSU_SUSFS not =y"; exit 1; }
            grep -q '^CONFIG_KSU_SUSFS_SUS_PATH=y' out/.config && { echo "FATAL: SUS_PATH must be =n"; exit 1; }
            grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y' out/.config && { echo "FATAL: SUS_MOUNT must be =n"; exit 1; }
            true
          else
            # stage 1 has KernelSU but no SUSFS, so cmd_gate would fail on its
            # unconditional CONFIG_KSU_SUSFS=y demand. Run the same 30-symbol
            # inline gate as the baseline job (identical text) and add the two
            # KernelSU expectations for this stage.
          fail=0
          check() { # name want
            got=$(grep -E "^$1=" out/.config 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' || true)
            if [ -z "$got" ]; then
              if grep -q "^# $1 is not set" out/.config 2>/dev/null; then got=n; else got='<absent>'; fi
            fi
            if [ "$got" = "$2" ]; then
              printf '  %-34s want=%-6s got=%-8s OK\n' "$1" "$2" "$got"
            else
              printf '  %-34s want=%-6s got=%-8s FAIL\n' "$1" "$2" "$got"; fail=1
            fi
          }
          check CONFIG_MODULES y
          check CONFIG_MODULE_UNLOAD y
          check CONFIG_MODULE_SIG n
          check CONFIG_MODULE_FORCE_LOAD n
          check CONFIG_MODULE_FORCE_UNLOAD n
          check CONFIG_MODVERSIONS y
          check CONFIG_MODULES_USE_ELF_RELA y
          check CONFIG_TRACEPOINTS y
          check CONFIG_EVENT_TRACING y
          check CONFIG_FTRACE y
          check CONFIG_FUNCTION_TRACER n
          check CONFIG_KPROBES n
          check CONFIG_JUMP_LABEL n
          check CONFIG_KALLSYMS y
          check CONFIG_KALLSYMS_ALL y
          check CONFIG_ARM64_MODULE_PLTS y
          check CONFIG_ARM64_4K_PAGES y
          check CONFIG_ARM64_VA_BITS 39
          check CONFIG_PREEMPT y
          check CONFIG_SMP y
          check CONFIG_STRICT_MODULE_RWX y
          check CONFIG_RANDOMIZE_BASE y
          check CONFIG_SDCARD_FS y
          check CONFIG_OVERLAY_FS y
          check CONFIG_USER_NS n
          check CONFIG_PID_NS n
          check CONFIG_PROC_KCORE n
          check CONFIG_DEVMEM n
          check CONFIG_TRIM_UNUSED_KSYMS n
          check CONFIG_THREAD_INFO_IN_TASK y
            check CONFIG_KSU y
            check CONFIG_KSU_SUSFS n
            [ $fail = 0 ] || { echo "FATAL: ABI config drifted (stage 1)"; exit 1; }
          fi

          KR=$(make -s ARCH=arm64 SUBARCH=arm64 O=out kernelrelease)
          echo "kernelrelease: $KR"
          test "$KR" = "$TARGET_UTS_RELEASE" \
            || { echo "FATAL: kernelrelease '$KR' != '$TARGET_UTS_RELEASE'"; exit 1; }

      - name: "10b. stub for the symbol the OSS drop forgot"
        run: |
          set -euo pipefail
          # input.c:449 calls touch_press_release_events_collect() whenever
          # CONFIG_LAST_TOUCH_EVENTS=y, and the official IKCONFIG dump DOES set it.
          # The implementation is NOT in nabu-r-oss: drivers/input/Makefile has no
          # obj- line for it and no source file defines it, so vmlinux dies at link
          # with "undefined symbol: touch_press_release_events_collect".
          # Provide a no-op body. It defines no struct and changes no type, so no
          # genksyms CRC can move and the config stays byte-identical to official.
          cd kernel-source
          cat > drivers/input/last_touch_events_stub.c <<'STUBEOF'
          #include <linux/kernel.h>
          #include <linux/input.h>

          /*
           * Body intentionally empty: the vendor's real implementation was never
           * published. A module's loadability depends on vermagic and symbol CRCs,
           * not on what this function does at runtime.
           */
          void touch_press_release_events_collect(struct input_dev *dev,
                                                  unsigned int type,
                                                  unsigned int code,
                                                  int value)
          {
          }
          STUBEOF
          grep -q 'last_touch_events_stub' drivers/input/Makefile \
            || echo 'input-core-y += last_touch_events_stub.o' >> drivers/input/Makefile
          grep 'last_touch_events_stub' drivers/input/Makefile
          test -f drivers/input/last_touch_events_stub.c
          echo "stub installed for touch_press_release_events_collect"

          # selinux hooks.c marks selinux_enforcing_boot __rticdata, parking it in
          # .bss.rtic. arch/arm64/kernel/vmlinux.lds.S only emits
          # KEEP(*(.bss.rtic)) inside a nested .bss block that the enclosing .bss
          # evicts, so the variable lands outside the +/-1MB ADRP window and the
          # link dies: relocation truncated to fit ... against '.bss.rtic'
          # Dropping the attribute only changes which section the int lives in.
          # It is a plain static int, exported to no module, so no CRC can move.
          sed -i 's/selinux_enforcing_boot __rticdata/selinux_enforcing_boot/' security/selinux/hooks.c
          grep -n 'selinux_enforcing_boot' security/selinux/hooks.c | head -3
          if grep -q '__rticdata' security/selinux/hooks.c; then
            echo "FATAL: __rticdata still present"; exit 1
          fi
          echo "rtic attribute stripped from selinux_enforcing_boot"

      - name: "11. build"
        run: |
          set -euo pipefail
          export PATH="$PWD/tc/bin:$PATH"
          # lld does the final link. An earlier run switched to GNU bfd because
          # lld 10 died with "output file too large: 18446743524396893... bytes"
          # (a negative offset read as unsigned) - but that was the same .bss.rtic
          # layout bug the stub step now strips. bfd is not an option anyway: it
          # produces a layout kallsyms rejects with "relative symbol value ...
          # out of range in relative mode" under CONFIG_KALLSYMS_BASE_RELATIVE=y.
          cd kernel-source
          if [ "${{ inputs.toolchain }}" = "neutron" ]; then
            echo "KBUILD_CFLAGS += -fcommon" >> Makefile
            sed -i 's/^KBUILD_CFLAGS += $(call cc-option, -mllvm -disable-struct-const-merge).*$/# dropped for clang 24 (flag removed)/' Makefile
            echo "KBUILD_CFLAGS += -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-unused-but-set-variable" >> Makefile
            export KCFLAGS="-w -Wno-error -fcommon"
          else
            export KCFLAGS="-w -Wno-error"
          fi

          # KSU v1.0.5 spells these as make variables, not C defines, so they must
          # reach make (environment export works because the Makefile uses ifndef
          # defaults; passing them on the command line is equivalent and explicit).
          export KSU_MANAGER_PACKAGE="${KSU_MANAGER_PACKAGE}"
          export KSU_EXPECTED_HASH="${KSU_EXPECTED_HASH}"
          export KSU_EXPECTED_SIZE="${KSU_EXPECTED_SIZE}"
          echo "KSU_MANAGER_PACKAGE=$KSU_MANAGER_PACKAGE"
          echo "KSU_EXPECTED_HASH=$KSU_EXPECTED_HASH"
          echo "KSU_EXPECTED_SIZE=$KSU_EXPECTED_SIZE"

          make ARCH=arm64 SUBARCH=arm64 O=out \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LOCALVERSION= \
            KSU_MANAGER_PACKAGE="$KSU_MANAGER_PACKAGE" \
            KSU_EXPECTED_HASH="$KSU_EXPECTED_HASH" \
            KSU_EXPECTED_SIZE="$KSU_EXPECTED_SIZE" \
            -j"$(nproc --all)" Image > ../build.log 2>&1 || {
              rc=$?
              echo "make failed rc=$rc"
              grep -nE "error:|Error [0-9]|undefined reference|No such file" ../build.log | head -80 || true
              tail -200 ../build.log
              exit $rc
            }
          ls -lh out/arch/arm64/boot/Image
          # Same gap as the baseline job: `Image` alone does not run modpost, so
          # Module.symvers would be missing and step 13b (CRC drift) would die on
          # "patched symvers missing". Stage 1/2 need it, so here it is fatal.
          make ARCH=arm64 SUBARCH=arm64 O=out \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LOCALVERSION= \
            KSU_MANAGER_PACKAGE="$KSU_MANAGER_PACKAGE" \
            KSU_EXPECTED_HASH="$KSU_EXPECTED_HASH" \
            KSU_EXPECTED_SIZE="$KSU_EXPECTED_SIZE" \
            -j"$(nproc --all)" modules >> ../build.log 2>&1 || {
              rc=$?
              echo "modules failed rc=$rc"
              grep -nE "error:|Error [0-9]|undefined reference|No such file" ../build.log | head -80 || true
              tail -200 ../build.log
              exit $rc
            }
          test -f out/Module.symvers || { echo "FATAL: no Module.symvers after modules build"; exit 1; }
          echo "Module.symvers entries: $(wc -l < out/Module.symvers)"

      - name: "12. GATE - vermagic + patch verification"
        run: |
          set -euo pipefail
          cd kernel-source
          IMG=out/arch/arm64/boot/Image
          BANNER=$(strings -a "$IMG" | grep -m1 '^Linux version ' || true)
          UTS=$(echo "$BANNER" | awk '{print $3}')
          REBUILT="$UTS SMP preempt mod_unload modversions aarch64"
          echo "banner  : ${BANNER:-<none>}"
          echo "UTS     : $UTS"
          echo "vermagic: $REBUILT"
          echo "$REBUILT" > ../vermagic.txt
          test "$UTS" = "$TARGET_UTS_RELEASE" || { echo "FATAL: UTS mismatch"; exit 1; }
          test "$REBUILT" = "$TARGET_VERMAGIC" || { echo "FATAL: vermagic mismatch"; exit 1; }

          echo "=== patch markers ==="
          python3 ../nabu_patch.py compatcheck .
          echo "=== KernelSU manager binding ==="
          # kernel/Makefile prints this when KSU_MANAGER_PACKAGE is set; grepping
          # the log proves the variable survived into the compiler invocation.
          grep -q "Manager package name: ${KSU_MANAGER_PACKAGE}" ../build.log \
            || { echo "FATAL: build log does not show KSU_MANAGER_PACKAGE=${KSU_MANAGER_PACKAGE}"; \
                 echo "       the manager signature check would fall back to defaults"; exit 1; }
          echo "  ok  manager package baked in: ${KSU_MANAGER_PACKAGE}"
          if [ "${{ inputs.stage }}" = "2" ]; then
            python3 ../nabu_patch.py verify .
          else
            # stage 1 has no SUSFS: assert the KSU-only markers
            for pair in "fs/exec.c:ksu_handle_execveat_sucompat" \
                        "fs/open.c:ksu_handle_faccessat" \
                        "fs/read_write.c:ksu_handle_sys_read" \
                        "fs/stat.c:ksu_handle_stat" \
                        "drivers/input/input.c:ksu_handle_input_handle_event" \
                        "drivers/tty/pty.c:ksu_handle_devpts" \
                        "fs/namespace.c:^int path_umount" \
                        "fs/internal.h:path_umount" \
                        "drivers/Kconfig:drivers/kernelsu/Kconfig"; do
              f=${pair%%:*}; p=${pair#*:}
              grep -qE "$p" "$f" || { echo "FATAL: missing $p in $f"; exit 1; }
              echo "  ok  $f :: $p"
            done
          fi
          echo "vermagic + marker gate: PASS"
          cp "$IMG" ../Image

      - name: "13. baseline symvers"
        uses: actions/download-artifact@v4
        with:
          name: baseline-symvers
          path: baseline

      - name: "13b. Module.symvers CRC drift report (Q7)"
        run: |
          set -euo pipefail
          # This step is the ONLY hard evidence that prebuilt .ko files will still
          # load. Do not let any command here degrade to a silent success.
          BASE=baseline/Module.symvers
          NEW=kernel-source/out/Module.symvers
          test -f "$BASE" || { echo "FATAL: baseline symvers missing"; exit 1; }
          test -f "$NEW"  || { echo "FATAL: patched symvers missing"; exit 1; }

          # Module.symvers is: CRC <tab> SYMBOL <tab> MODULE <tab> EXPORT
          TAB=$(printf '\t')
          awk -F'\t' 'NF>=2 { print $2"\t"$1 }' "$BASE" | LC_ALL=C sort > base.crc
          awk -F'\t' 'NF>=2 { print $2"\t"$1 }' "$NEW"  | LC_ALL=C sort > new.crc
          echo "baseline symbols : $(wc -l < base.crc)"
          echo "patched  symbols : $(wc -l < new.crc)"

          join -t "$TAB" base.crc new.crc > joined.crc
          awk -F'\t' '$2!=$3 { print $1"\t"$2"\t"$3 }' joined.crc > crc_changed.txt
          join -t "$TAB" -v1 base.crc new.crc | cut -f1 > removed.txt
          join -t "$TAB" -v2 base.crc new.crc | cut -f1 > added.txt

          echo
          echo "=== VERDICT RULE ==="
          echo "  module_layout CRC changed        -> FATAL, a config or type moved"
          echo "  any pre-existing symbol changed  -> FATAL, same reason"
          echo "  only new ksu_*/susfs_* symbols   -> SAFE"
          echo

          ML_B=$(awk -F'\t' -v s=module_layout '$1==s{print $2}' base.crc)
          ML_N=$(awk -F'\t' -v s=module_layout '$1==s{print $2}' new.crc)
          echo "module_layout: baseline=${ML_B:-<none>} patched=${ML_N:-<none>}"
          if [ -n "$ML_B" ] && [ "$ML_B" != "$ML_N" ]; then
            echo "FATAL: module_layout CRC moved. Every prebuilt .ko will be rejected."
            echo "       diff out/.config against official.config and find the flipped symbol."
            exit 1
          fi

          changed=$(wc -l < crc_changed.txt)
          echo "pre-existing symbols with a changed CRC: $changed"
          if [ "$changed" != "0" ]; then
            echo "--- changed ---"; cat crc_changed.txt
            echo "FATAL: $changed pre-existing symbol CRC(s) moved"
            exit 1
          fi

          echo "new symbols (expected: ksu_/susfs_ only): $(wc -l < added.txt)"
          grep -vE '^(ksu_|susfs_|ksu_susfs|__ksu|ksud)' added.txt > added_unexpected.txt || true
          if [ -s added_unexpected.txt ]; then
            echo "WARNING: non KSU/SUSFS symbols appeared:"; head -40 added_unexpected.txt
          fi
          echo "removed symbols: $(wc -l < removed.txt)"; head -40 removed.txt || true

          {
            echo "stage=${{ inputs.stage }} toolchain=${{ inputs.toolchain }}"
            echo "module_layout baseline=${ML_B:-<none>} patched=${ML_N:-<none>}"
            echo "changed=$changed added=$(wc -l < added.txt) removed=$(wc -l < removed.txt)"
            echo
            echo "== CRC CHANGED =="; cat crc_changed.txt
            echo; echo "== ADDED ==";   head -300 added.txt
            echo; echo "== REMOVED =="; head -300 removed.txt
          } > symvers_diff.txt
          echo "wrote symvers_diff.txt"

      - name: "14. pack AnyKernel3 (Image + dtb + dtbo.img, boot + vendor_boot)"
        run: |
          set -euo pipefail
          STAGE="${{ inputs.stage }}"
          test -d ak3_base || { echo "FATAL: payload did not produce ak3_base/"; exit 1; }
          cp -r ak3_base/* .
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          if [ -n "${AK3_COMMIT:-}" ]; then
            git -C ak3 checkout --detach "$AK3_COMMIT" \
              || { echo "WARNING: AK3_COMMIT checkout failed, staying on HEAD"; }
          else
            echo "WARNING: AK3_COMMIT empty, using HEAD"
          fi
          git -C ak3 rev-parse HEAD > AK3_COMMIT.txt
          rm -rf ak3/.git ak3/Image* ak3/dtb ak3/modules ak3/patch
          # The upstream clone only ships tools/ak3-core.sh; the packaged binary
          # helpers of the v0.2 zip are NOT rebuilt here on purpose. See the
          # README note written below for what the flasher must provide.
          test -f ak3/tools/ak3-core.sh || { echo "FATAL: ak3-core.sh missing"; exit 1; }

          cp Image ak3/Image
          # dtb/dtbo.img are the working v0.2 blobs, always. Baseline step 9 shows why
          # they are never rebuilt: arch/arm64/Makefile L187 defines
          # KBUILD_DTBO_IMG := dtbo.img and L223-231 define $(KBUILD_DTBO_IMG): dtbs
          # inside ifeq ($(CONFIG_BUILD_ARM64_DT_OVERLAY),y); the official config leaves
          # that symbol unset, so the rule exists but never fires.
          # AnyKernel3's flash_generic dtbo flashes ak3/dtbo.img to the dtbo
          # partition.
          cp ak3_base/dtb ak3/dtb
          cp ak3_base/dtbo.img ak3/dtbo.img
          cp anykernel.sh ak3/anykernel.sh
          # Same v0.2 structure note as the baseline pack step: the boot section
          # carries patch_vbmeta_flag=auto, which ak3-core.sh treats as unset.
          sed -i "s|kernel.string=.*|kernel.string=nabu v16 stage ${STAGE} (official 4.14.180)|" ak3/anykernel.sh
          grep -q "kernel.string=nabu stage ${STAGE}" ak3/anykernel.sh \
            || { echo "FATAL: kernel.string not rewritten for stage ${STAGE}"; exit 1; }
          N_VBMETA=$(grep -c 'patch_vbmeta_flag=auto' ak3/anykernel.sh)
          [ "$N_VBMETA" = "2" ] \
            || { echo "FATAL: expected 2 patch_vbmeta_flag lines (boot+vendor_boot), got $N_VBMETA"; exit 1; }

          cd ak3
          zip -r9 "../nabu-v16-s${STAGE}.zip" . -x '*.git*' >/dev/null
          cd ..
          sha256sum "nabu-v16-s${STAGE}.zip"
          echo "=== contents ==="
          unzip -l "nabu-v16-s${STAGE}.zip" | grep -E 'Image|dtb|anykernel.sh|ak3-core'

          cat > README-ROLLBACK.txt <<'ROLLBACKEOF'
          nabu v16 rollback
          =================

          This package was flashed by AnyKernel3, which rewrote boot and vendor_boot in
          place. AnyKernel3 does NOT back up the previous images, so the only reliable
          rollback source is the MIUI14 fastboot ROM for nabu:

            boot.img, vendor_boot.img and dtbo.img live inside images/ in the tgz.
            fastboot flash boot         boot.img
            fastboot flash vendor_boot  vendor_boot.img
            fastboot flash dtbo         dtbo.img
            fastboot reboot

          Either way the tablet boots WITHOUT root afterwards. To get the Kuugo v0.2
          kernel + KernelSU-Next back, reflash
          nabu_Hyperos1_KernelSU-Next_anykernel3_v0.2.zip with the KernelSU manager
          (it is an AnyKernel3 zip, not a recovery package).

          Slot note: this device is virtual A/B. `fastboot flash boot` writes the active
          slot; add _a / _b explicitly if you need to repair the other one.

          Flasher requirement
          -------------------
          This package does NOT bundle magiskboot or busybox. Upstream AnyKernel3 only
          ships tools/ak3-core.sh; the helper binaries of the original v0.2 zip are not
          reproduced here, and substituting them from a Magisk APK would replace
          osm0sis' applet set with an incompatible one.

          Flash it with a flasher that already provides magiskboot: KernelSU manager ->
          install -> pick this zip. If flashing reports "Splitting image failed", the
          flasher has no magiskboot - use the KernelSU manager, not a third-party
          recovery.
          ROLLBACKEOF

      - name: "15. upload"
        uses: actions/upload-artifact@v4
        with:
          name: nabu-v16-s${{ inputs.stage }}
          path: |
            nabu-v16-s${{ inputs.stage }}.zip
            README-ROLLBACK.txt
            AK3_COMMIT.txt
          if-no-files-found: error

      - name: "15b. upload symvers report"
        uses: actions/upload-artifact@v4
        with:
          name: symvers-diff-s${{ inputs.stage }}
          path: symvers_diff.txt
          if-no-files-found: warn

      - name: "16. build log on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-s${{ inputs.stage }}
          path: build.log
          if-no-files-found: warn
