          # Why CONFIG_LOCALVERSION="-perf-gcc5ee28d3084" and not "-perf":
          # the official config has CONFIG_LOCALVERSION_AUTO=y, so
          # setlocalversion appends -g<short-hash> (or -dirty) *after*
          # CONFIG_LOCALVERSION. In a --depth=1 clone git describe has no tag, so
          # that suffix degrades to "-g<sha>" of an arbitrary commit; in a
          # tarball checkout it is not reproducible at all. Writing .scmversion
          # is what stops it, and once .scmversion exists the value of
          # CONFIG_LOCALVERSION is the whole version string.
          printf '' > .scmversion
          S="scripts/config --file out/.config"
          $S --set-str LOCALVERSION "-perf-gcc5ee28d3084"
          $S --disable LOCALVERSION_AUTO

          # The ABI lock. Every one of these already has the wanted value in the
          # extracted config; they are re-asserted so a future edit to this yml
          # that flips one is visible in the gate instead of silently shipping.
          $S --enable  MODULES
          $S --enable  MODULE_UNLOAD
          $S --enable  MODVERSIONS
          $S --disable MODULE_SIG
          $S --disable MODULE_FORCE_LOAD
          $S --disable MODULE_FORCE_UNLOAD
          $S --disable KPROBES
          $S --enable  OVERLAY_FS
          $S --enable  SDCARD_FS
          $S --disable WERROR || true

          # dtb: pack_dtb=true turns on CONFIG_BUILD_ARM64_DT_OVERLAY, which is what
          # gates the dtbo/dtb rules. The rule DOES exist in this tree:
          # arch/arm64/Makefile L187 defines KBUILD_DTBO_IMG := dtbo.img and
          # L223-231 define $(KBUILD_DTBO_IMG): dtbs inside the same ifeq, so with the
          # symbol unset (the official config) it simply never fires. dtb and dtbo.img
          # therefore always ship from the v0.2 package.
          if [ "${{ inputs.pack_dtb }}" = "true" ]; then
            $S --enable BUILD_ARM64_DT_OVERLAY
          fi

          make ARCH=arm64 SUBARCH=arm64 O=out olddefconfig

      - name: "6. GATE - ABI config unchanged (30 ABI-locked symbols)"
        run: |
          set -euo pipefail
          cd src
          # This step deliberately does NOT call `nabu_patch.py gate`. cmd_gate
          # (patcher L944-1015) demands CONFIG_KSU=y AND CONFIG_KSU_SUSFS=y at
          # L960-965 with no stage condition, so it can only ever pass in stage 2.
          # The inline gate below checks the 30 ABI symbols and nothing else,
          # which is exactly what a baseline (no KSU) or stage-1 build needs.
          #
          # check() must stay byte-identical to the stage-1 copy in the build job.
          fail=0
          check() { # name want
            got=$(grep -E "^$1=" out/.config 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' || true)
            if [ -z "$got" ]; then
              if grep -q "^# $1 is not set" out/.config 2>/dev/null; then got=n; else got='<absent>'; fi
            fi
            if [ "$got" = "$2" ]; then
              printf '  %-34s want=%-6s got=%-8s OK\n' "$1" "$2" "$got"
            else
              printf '  %-34s want=%-6s got=%-8s FAIL\n' "$1" "$2" "$got"; fail=1
            fi
          }
          check CONFIG_MODULES y
          check CONFIG_MODULE_UNLOAD y
          check CONFIG_MODULE_SIG n
          check CONFIG_MODULE_FORCE_LOAD n
          check CONFIG_MODULE_FORCE_UNLOAD n
          check CONFIG_MODVERSIONS y
          check CONFIG_MODULES_USE_ELF_RELA y
          check CONFIG_TRACEPOINTS y
          check CONFIG_EVENT_TRACING y
          check CONFIG_FTRACE y
          check CONFIG_FUNCTION_TRACER n
          check CONFIG_KPROBES n
          check CONFIG_JUMP_LABEL n
          check CONFIG_KALLSYMS y
          check CONFIG_KALLSYMS_ALL y
          check CONFIG_ARM64_MODULE_PLTS y
          check CONFIG_ARM64_4K_PAGES y
          check CONFIG_ARM64_VA_BITS 39
          check CONFIG_PREEMPT y
          check CONFIG_SMP y
          check CONFIG_STRICT_MODULE_RWX y
          check CONFIG_RANDOMIZE_BASE y
          check CONFIG_SDCARD_FS y
          check CONFIG_OVERLAY_FS y
          check CONFIG_USER_NS n
          check CONFIG_PID_NS n
          check CONFIG_PROC_KCORE n
          check CONFIG_DEVMEM n
          check CONFIG_TRIM_UNUSED_KSYMS n
          check CONFIG_THREAD_INFO_IN_TASK y
          [ $fail = 0 ] || { echo "FATAL: ABI config drifted"; exit 1; }

          # Q3 continued: assert kernelrelease before wasting 40 minutes of build.
          KR=$(make -s ARCH=arm64 SUBARCH=arm64 O=out kernelrelease)
          echo "make kernelrelease: $KR"
          test "$KR" = "$TARGET_UTS_RELEASE" \
            || { echo "FATAL: kernelrelease '$KR' != '$TARGET_UTS_RELEASE'"; exit 1; }

      - name: "7. build Image (+ Module.symvers)"
        run: |
          set -euo pipefail
          export PATH="$PWD/tc/bin:$PATH"
          cd src
          if [ "${{ inputs.toolchain }}" = "neutron" ]; then
            # Route B: clang 24 against a 2019 tree. Known breakages and the
            # minimal surgery that keeps them from reaching the compiler.
            echo "== neutron fixups =="
            # -fno-common became the default in GCC 10 / clang 11; 4.14 relies on
            # tentative definitions merging. Re-enable the old behaviour.
            echo "KBUILD_CFLAGS += -fcommon" >> Makefile
            # -mllvm flags the tree passes were renamed or dropped. cc-option
            # already filters unsupported ones, but the unconditional ones in
            # Makefile.core are not; strip them.
            sed -i 's/^KBUILD_CFLAGS += $(call cc-option, -mllvm -disable-struct-const-merge).*$/# dropped for clang 24 (flag removed)/' Makefile
            # Newer clang promotes a pile of pre-C99 diagnostics to errors.
            echo "KBUILD_CFLAGS += -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-unused-but-set-variable" >> Makefile
            export KCFLAGS="-w -Wno-error -fcommon"
          else
            export KCFLAGS="-w -Wno-error"
          fi

          make ARCH=arm64 SUBARCH=arm64 O=out \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LOCALVERSION= \
            -j"$(nproc --all)" Image > ../build-baseline.log 2>&1 || {
              rc=$?
              echo "make failed rc=$rc"
              grep -nE "error:|Error [0-9]|undefined reference" ../build-baseline.log | head -60 || true
              tail -150 ../build-baseline.log
              exit $rc
            }
          ls -lh out/arch/arm64/boot/Image

          # `make Image` never runs modpost, so out/Module.symvers does NOT exist
          # yet: arch/arm64/Makefile L187 is `Image: vmlinux`, and the modpost call
          # is top-level Makefile L1446 under `modules:`. Build the module tree to
          # get the symvers baseline stage 1/2 compares against - non-fatally,
          # because stage 0 exists to prove the vermagic and a module that refuses
          # to compile must not hide a good Image.
          make ARCH=arm64 SUBARCH=arm64 O=out \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LOCALVERSION= \
            -j"$(nproc --all)" modules >> ../build-baseline.log 2>&1 \
            || echo "WARNING: modules target failed - continuing without Module.symvers"
          if [ -f out/Module.symvers ]; then
            echo "Module.symvers entries: $(wc -l < out/Module.symvers)"
          else
            echo "WARNING: out/Module.symvers absent - stage 1/2 CRC baseline unavailable"
          fi

      - name: "8. GATE - vermagic byte check + kernel size record (Q4)"
        run: |
          set -euo pipefail
          cd src
          IMG=out/arch/arm64/boot/Image
          BANNER=$(strings -a "$IMG" | grep -m1 '^Linux version ' || true)
          echo "Image banner : ${BANNER:-<none>}"
          test -n "$BANNER" || { echo "FATAL: no Linux version string in Image"; exit 1; }

          UTS=$(echo "$BANNER" | awk '{print $3}')
          echo "UTS_RELEASE  : $UTS"

          # Rebuild the exact vermagic string module.c will compare against.
          # include/linux/vermagic.h orders it as:
          #   UTS_RELEASE " " SMP PREEMPT MODULE_UNLOAD MODVERSIONS ARCH
          REBUILT="$UTS SMP preempt mod_unload modversions aarch64"
          echo "rebuilt      : $REBUILT"
          echo "target       : $TARGET_VERMAGIC"
          echo "$REBUILT" > ../vermagic.txt

          if [ "$UTS" != "$TARGET_UTS_RELEASE" ]; then
            echo "FATAL: UTS_RELEASE '$UTS' != '$TARGET_UTS_RELEASE'"
            echo "       check CONFIG_LOCALVERSION, .scmversion and that LOCALVERSION_AUTO is off"
            exit 1
          fi
          if [ "$REBUILT" != "$TARGET_VERMAGIC" ]; then
            echo "FATAL: vermagic '$REBUILT' != '$TARGET_VERMAGIC'"
            exit 1
          fi

          # Independent confirmation: the literal string must be findable inside
          # the image, because the out-of-tree driver carries it in .modinfo and
          # the kernel compares against its own copy.
          if strings -a "$IMG" | grep -qxF "$TARGET_UTS_RELEASE"; then
            echo "UTS_RELEASE found as a standalone string: yes"
          else
            echo "NOTE: UTS_RELEASE not standalone in Image (compiled into vermagic blobs); banner+rebuild check stands"
          fi
          # The official boot.img header v3 carries kernel_size=41695744 and that
          # kernel segment is a BARE Image, not Image-dtb: the banner sits at
          # 18354191 and the vermagic at 18408792 inside a 41695744-byte segment,
          # which only fits an uncompressed Image. So `make Image` is the correct
          # target here. Do NOT switch to Image.gz-dtb even though the config has
          # CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y - that setting only makes
          # KBUILD_TARGET Image-dtb for the `all` target, which this workflow
          # never builds.
          IMGSZ=$(wc -c < out/arch/arm64/boot/Image)
          echo "Image size: $IMGSZ (official boot.img kernel_size = 41695744)"
          if [ "$IMGSZ" -gt 60000000 ] || [ "$IMGSZ" -lt 20000000 ]; then
            echo "WARNING: Image size far from official range - verify before flashing"
          fi
          echo "vermagic gate: PASS"
          cp "$IMG" ../Image.stage0

      - name: "9. dtb diagnostic - why dtbo.img is never rebuilt (Q: dtbo target)"
        run: |
          set -euo pipefail
          # arch/arm64/Makefile L187 defines KBUILD_DTBO_IMG := dtbo.img and
          # L223-231 define $(KBUILD_DTBO_IMG): dtbs / $(KBUILD_DTB_IMG): dtbs,
          # all inside ifeq ($(CONFIG_BUILD_ARM64_DT_OVERLAY),y). The official
          # config leaves that symbol unset, so the rules exist but never fire.
          # That is why dtbo.img is never rebuilt here: it always ships from the
          # working v0.2 package. pack_dtb=true enables the symbol only for a
          # diagnostic dtbs build; its output still does not enter the package.
          echo "--- check 1: dtbo.img rule exists in arch/arm64/Makefile (config-gated) ---"
          grep -qE 'KBUILD_DTBO_IMG[[:space:]]*:=|^\$\(KBUILD_DTBO_IMG\)[[:space:]]*:' \
            src/arch/arm64/Makefile \
            || { echo "FATAL: upstream KBUILD_DTBO_IMG rule not found"; exit 1; }
          echo "confirmed: \$(KBUILD_DTBO_IMG): dtbs exists, gated by CONFIG_BUILD_ARM64_DT_OVERLAY"

          echo "--- check 2: BUILD_ARM64_DT_OVERLAY matches the pack_dtb input ---"
          if [ "${{ inputs.pack_dtb }}" = "true" ]; then
            grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y' src/out/.config \
              || { echo "FATAL: pack_dtb=true but DT_OVERLAY not enabled"; exit 1; }
            echo "confirmed: overlay dtb build is enabled (pack_dtb=true)"
          else
            grep -q '^# CONFIG_BUILD_ARM64_DT_OVERLAY is not set' src/out/.config \
              || { echo "FATAL: DT_OVERLAY unexpectedly set"; exit 1; }
            echo "confirmed: overlay dtb build is disabled (pack_dtb=false)"
          fi

          if [ "${{ inputs.pack_dtb }}" = "true" ]; then
            echo "--- diagnostic: building dtbs ---"
            export PATH="$PWD/tc/bin:$PATH"
            ( cd src && make ARCH=arm64 SUBARCH=arm64 O=out \
                CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
                OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
                CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                KCFLAGS="-w -Wno-error" -j"$(nproc --all)" dtbs ) >> build-baseline.log 2>&1
            mkdir -p dtb-diagnostic
            find src/out -name '*.dtb' -exec cp {} dtb-diagnostic/ \; 2>/dev/null || true
            N=$(ls dtb-diagnostic 2>/dev/null | wc -l)
            echo "dtbs produced: $N"
            if [ "$N" = "0" ]; then
              echo "note: dtbs produced no .dtb; the tree does not build DT for this config"
            fi
            # A tree-built dtb must at least mention nabu, otherwise it is a
            # generic SM8150 blob and must never reach a device.
            if ls dtb-diagnostic/*.dtb >/dev/null 2>&1; then
              if strings -a dtb-diagnostic/*.dtb | grep -qi 'nabu'; then
                echo "at least one tree-built dtb mentions nabu"
              else
                echo "WARNING: no tree-built dtb mentions nabu - do not flash these"
              fi
            fi
          else
            echo "pack_dtb=false: dtb/dtbo.img come from the v0.2 blobs"
          fi
          # the shipped blobs are always the working v0.2 ones
          ls -l ak3_base/dtb ak3_base/dtbo.img
          python3 - <<'PY'
          d = open('ak3_base/dtb','rb').read(4)
          o = open('ak3_base/dtbo.img','rb').read(4)
          assert d == b'\xd0\x0d\xfe\xed', ('dtb is not an FDT blob', d)
          assert o[0] == 0xd7 and o[1] == 0xb7, ('dtbo.img is not a dt_table', o)
          print('ak3_base/dtb      : FDT magic OK')
          print('ak3_base/dtbo.img : dt_table magic OK')
          PY

      - name: "10. pack stage 0 (official kernel, no root, no SUSFS)"
        run: |
          set -euo pipefail
          test -d ak3_base || { echo "FATAL: payload did not produce ak3_base/"; exit 1; }
          cp -r ak3_base/* .
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          if [ -n "${AK3_COMMIT:-}" ]; then
            git -C ak3 checkout --detach "$AK3_COMMIT" \
              || { echo "WARNING: AK3_COMMIT checkout failed, staying on HEAD"; }
          else
            echo "WARNING: AK3_COMMIT empty, using HEAD"
          fi
          git -C ak3 rev-parse HEAD > AK3_COMMIT.txt
          rm -rf ak3/.git ak3/Image* ak3/dtb ak3/modules ak3/patch
          # The upstream clone only ships tools/ak3-core.sh; the packaged binary
          # helpers of the v0.2 zip are NOT rebuilt here on purpose. See the
          # README note written below for what the flasher must provide.
          test -f ak3/tools/ak3-core.sh || { echo "FATAL: ak3-core.sh missing"; exit 1; }
          cp Image.stage0 ak3/Image
          cp ak3_base/dtb ak3/dtb
          cp ak3_base/dtbo.img ak3/dtbo.img
          cp anykernel.sh ak3/anykernel.sh
          # The payload script is structurally the v0.2 script. Its boot section
          # additionally carries patch_vbmeta_flag=auto, which AK3 ak3-core.sh
          # treats identically to leaving it unset (auto/empty preserves whatever
          # dump_boot decided). So expect exactly two occurrences: boot +
          # vendor_boot.
          sed -i "s|kernel.string=.*|kernel.string=nabu stage 0 (official 4.14.180, no root, no SUSFS)|" ak3/anykernel.sh
          grep -q 'kernel.string=nabu stage 0' ak3/anykernel.sh \
            || { echo "FATAL: stage 0 kernel.string not rewritten"; exit 1; }
          N_VBMETA=$(grep -c 'patch_vbmeta_flag=auto' ak3/anykernel.sh)
          [ "$N_VBMETA" = "2" ] \
            || { echo "FATAL: expected 2 patch_vbmeta_flag lines (boot+vendor_boot), got $N_VBMETA"; exit 1; }
          echo "anykernel.sh: stage 0 string set, 2 patch_vbmeta_flag lines present"
          cd ak3
          zip -r9 ../nabu-v16-s0.zip . -x '*.git*' >/dev/null
          cd ..
          sha256sum nabu-v16-s0.zip
          unzip -l nabu-v16-s0.zip | grep -E 'Image|dtb|anykernel.sh|ak3-core'

      - uses: actions/upload-artifact@v4
        with:
          name: nabu-v16-s0
          path: |
            nabu-v16-s0.zip
            vermagic.txt
            AK3_COMMIT.txt
          if-no-files-found: error

      - name: "11. export baseline Module.symvers for stage 1/2"
        uses: actions/upload-artifact@v4
        with:
          name: baseline-symvers
          path: src/out/Module.symvers
          # warn, not error: stage 0's deliverable is the Image+zip. If the module
          # tree did not compile, stage 1 will fail loudly at step 13 instead.
          if-no-files-found: warn

      - name: "12. build log on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-build-log
          path: build-baseline.log
          if-no-files-found: warn

  # ==========================================================================
  # build - stage 1 and 2. Needs the baseline symvers, so it is gated on
  # needs: baseline (v13's parallel jobs raced here and the download failed).
  # ==========================================================================
  build:
    needs: baseline
    # stage 0 is complete after baseline; 1/2 add KSU/SUSFS on top.
    if: ${{ inputs.stage != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: "1. host deps"
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y build-essential git zip unzip xz-utils bc flex bison \
            libssl-dev libelf-dev python3 device-tree-compiler ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: "2. toolchain"
        run: |
          set -euo pipefail
          mkdir -p tc
          if [ "${{ inputs.toolchain }}" = "neutron" ]; then
            cd tc
            curl -fsSL --retry 3 -o antman https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
            chmod +x antman
            ./antman -S
            ./antman -I
          else
            curl -fsSL --retry 3 -o clang.tar.gz "$AOSP_CLANG_URL"
            tar -xzf clang.tar.gz -C tc
            rm -f clang.tar.gz
            test -x tc/bin/clang
            tc/bin/clang --version | head -1
          tc/bin/clang --version | grep -q 'clang version 10\.' \
            || { echo "FATAL: aosp clang is not 10.x - banner mismatch"; exit 1; }
          fi

