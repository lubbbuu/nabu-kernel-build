          CONFIGEOF
          gunzip -f official.config.gz
          test "$(sha256sum official.config | cut -d' ' -f1)" = "$CONFIG_SHA256" \
            || { echo "FATAL: config hash mismatch"; exit 1; }

          cd kernel-source
          mkdir -p out
          cp ../official.config out/.config
          printf '' > .scmversion
          S="scripts/config --file out/.config"
          $S --set-str LOCALVERSION "-perf-gcc5ee28d3084"
          $S --disable LOCALVERSION_AUTO

          # ABI lock - see the header comment. Do not touch.
          $S --enable  MODULES
          $S --enable  MODULE_UNLOAD
          $S --enable  MODVERSIONS
          $S --disable MODULE_SIG
          $S --disable MODULE_FORCE_LOAD
          $S --disable MODULE_FORCE_UNLOAD
          $S --disable KPROBES
          $S --disable KPROBE_EVENTS || true
          $S --enable  OVERLAY_FS
          $S --enable  SDCARD_FS
          $S --disable WERROR || true

          # root, built in: non-GKI cannot load KSU as a module
          $S --enable  KSU
          $S --disable KSU_DEBUG

          if [ "${{ inputs.stage }}" = "2" ]; then
            # Only the features this 4.14 VFS can host.
            $S --enable  KSU_SUSFS
            $S --enable  KSU_SUSFS_SUS_KSTAT
            $S --enable  KSU_SUSFS_TRY_UMOUNT
            $S --enable  KSU_SUSFS_SPOOF_UNAME
            $S --enable  KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            $S --enable  KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            $S --enable  KSU_SUSFS_ENABLE_LOG
            # Off by design: >=5.4 VFS required. Enabling any of these will not
            # compile on 4.14, and the yml previously claimed they worked.
            $S --disable KSU_SUSFS_SUS_PATH
            $S --disable KSU_SUSFS_SUS_MOUNT
            $S --disable KSU_SUSFS_OPEN_REDIRECT
            $S --disable KSU_SUSFS_SUS_SU
            $S --disable KSU_SUSFS_HAS_MAGIC_MOUNT
            $S --disable KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
            $S --disable KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
            $S --disable KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          fi

          if [ "${{ inputs.pack_dtb }}" = "true" ]; then
            $S --enable BUILD_ARM64_DT_OVERLAY
          fi

          make ARCH=arm64 SUBARCH=arm64 O=out olddefconfig

      - name: "10. GATE - ABI config per stage (baseline gate + KSU expectations)"
        run: |
          set -euo pipefail
          cd kernel-source
          if [ "${{ inputs.stage }}" = "2" ]; then
            # stage 2 is the only stage where cmd_gate is valid: it checks the
            # 30 ABI symbols AND demands CONFIG_KSU=y + CONFIG_KSU_SUSFS=y.
            python3 ../nabu_patch.py gate .
            grep -q '^CONFIG_KSU_SUSFS=y' out/.config || { echo "FATAL: KSU_SUSFS not =y"; exit 1; }
            grep -q '^CONFIG_KSU_SUSFS_SUS_PATH=y' out/.config && { echo "FATAL: SUS_PATH must be =n"; exit 1; }
            grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y' out/.config && { echo "FATAL: SUS_MOUNT must be =n"; exit 1; }
            true
          else
            # stage 1 has KernelSU but no SUSFS, so cmd_gate would fail on its
            # unconditional CONFIG_KSU_SUSFS=y demand. Run the same 30-symbol
            # inline gate as the baseline job (identical text) and add the two
            # KernelSU expectations for this stage.
          fail=0
          check() { # name want
            got=$(grep -E "^$1=" out/.config 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' || true)
            if [ -z "$got" ]; then
              if grep -q "^# $1 is not set" out/.config 2>/dev/null; then got=n; else got='<absent>'; fi
            fi
            if [ "$got" = "$2" ]; then
              printf '  %-34s want=%-6s got=%-8s OK\n' "$1" "$2" "$got"
            else
              printf '  %-34s want=%-6s got=%-8s FAIL\n' "$1" "$2" "$got"; fail=1
            fi
          }
          check CONFIG_MODULES y
          check CONFIG_MODULE_UNLOAD y
          check CONFIG_MODULE_SIG n
          check CONFIG_MODULE_FORCE_LOAD n
          check CONFIG_MODULE_FORCE_UNLOAD n
          check CONFIG_MODVERSIONS y
          check CONFIG_MODULES_USE_ELF_RELA y
          check CONFIG_TRACEPOINTS y
          check CONFIG_EVENT_TRACING y
          check CONFIG_FTRACE y
          check CONFIG_FUNCTION_TRACER n
          check CONFIG_KPROBES n
          check CONFIG_JUMP_LABEL n
          check CONFIG_KALLSYMS y
          check CONFIG_KALLSYMS_ALL y
          check CONFIG_ARM64_MODULE_PLTS y
          check CONFIG_ARM64_4K_PAGES y
          check CONFIG_ARM64_VA_BITS 39
          check CONFIG_PREEMPT y
          check CONFIG_SMP y
          check CONFIG_STRICT_MODULE_RWX y
          check CONFIG_RANDOMIZE_BASE y
          check CONFIG_SDCARD_FS y
          check CONFIG_OVERLAY_FS y
          check CONFIG_USER_NS n
          check CONFIG_PID_NS n
          check CONFIG_PROC_KCORE n
          check CONFIG_DEVMEM n
          check CONFIG_TRIM_UNUSED_KSYMS n
          check CONFIG_THREAD_INFO_IN_TASK y
            check CONFIG_KSU y
            check CONFIG_KSU_SUSFS n
            [ $fail = 0 ] || { echo "FATAL: ABI config drifted (stage 1)"; exit 1; }
          fi

          KR=$(make -s ARCH=arm64 SUBARCH=arm64 O=out kernelrelease)
          echo "kernelrelease: $KR"
          test "$KR" = "$TARGET_UTS_RELEASE" \
            || { echo "FATAL: kernelrelease '$KR' != '$TARGET_UTS_RELEASE'"; exit 1; }

      - name: "11. build"
        run: |
          set -euo pipefail
          export PATH="$PWD/tc/bin:$PATH"
          cd kernel-source
          if [ "${{ inputs.toolchain }}" = "neutron" ]; then
            echo "KBUILD_CFLAGS += -fcommon" >> Makefile
            sed -i 's/^KBUILD_CFLAGS += $(call cc-option, -mllvm -disable-struct-const-merge).*$/# dropped for clang 24 (flag removed)/' Makefile
            echo "KBUILD_CFLAGS += -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-unused-but-set-variable" >> Makefile
            export KCFLAGS="-w -Wno-error -fcommon"
          else
            export KCFLAGS="-w -Wno-error"
          fi

          # KSU v1.0.5 spells these as make variables, not C defines, so they must
          # reach make (environment export works because the Makefile uses ifndef
          # defaults; passing them on the command line is equivalent and explicit).
          export KSU_MANAGER_PACKAGE="${KSU_MANAGER_PACKAGE}"
          export KSU_EXPECTED_HASH="${KSU_EXPECTED_HASH}"
          export KSU_EXPECTED_SIZE="${KSU_EXPECTED_SIZE}"
          echo "KSU_MANAGER_PACKAGE=$KSU_MANAGER_PACKAGE"
          echo "KSU_EXPECTED_HASH=$KSU_EXPECTED_HASH"
          echo "KSU_EXPECTED_SIZE=$KSU_EXPECTED_SIZE"

          make ARCH=arm64 SUBARCH=arm64 O=out \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LOCALVERSION= \
            KSU_MANAGER_PACKAGE="$KSU_MANAGER_PACKAGE" \
            KSU_EXPECTED_HASH="$KSU_EXPECTED_HASH" \
            KSU_EXPECTED_SIZE="$KSU_EXPECTED_SIZE" \
            -j"$(nproc --all)" Image > ../build.log 2>&1 || {
              rc=$?
              echo "make failed rc=$rc"
              grep -nE "error:|Error [0-9]|undefined reference|No such file" ../build.log | head -80 || true
              tail -200 ../build.log
              exit $rc
            }
          ls -lh out/arch/arm64/boot/Image
          # Same gap as the baseline job: `Image` alone does not run modpost, so
          # Module.symvers would be missing and step 13b (CRC drift) would die on
          # "patched symvers missing". Stage 1/2 need it, so here it is fatal.
          make ARCH=arm64 SUBARCH=arm64 O=out \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LOCALVERSION= \
            KSU_MANAGER_PACKAGE="$KSU_MANAGER_PACKAGE" \
            KSU_EXPECTED_HASH="$KSU_EXPECTED_HASH" \
            KSU_EXPECTED_SIZE="$KSU_EXPECTED_SIZE" \
            -j"$(nproc --all)" modules >> ../build.log 2>&1 || {
              rc=$?
              echo "modules failed rc=$rc"
              grep -nE "error:|Error [0-9]|undefined reference|No such file" ../build.log | head -80 || true
              tail -200 ../build.log
              exit $rc
            }
          test -f out/Module.symvers || { echo "FATAL: no Module.symvers after modules build"; exit 1; }
          echo "Module.symvers entries: $(wc -l < out/Module.symvers)"

      - name: "12. GATE - vermagic + patch verification"
        run: |
          set -euo pipefail
          cd kernel-source
          IMG=out/arch/arm64/boot/Image
          BANNER=$(strings -a "$IMG" | grep -m1 '^Linux version ' || true)
          UTS=$(echo "$BANNER" | awk '{print $3}')
          REBUILT="$UTS SMP preempt mod_unload modversions aarch64"
          echo "banner  : ${BANNER:-<none>}"
          echo "UTS     : $UTS"
          echo "vermagic: $REBUILT"
          echo "$REBUILT" > ../vermagic.txt
          test "$UTS" = "$TARGET_UTS_RELEASE" || { echo "FATAL: UTS mismatch"; exit 1; }
          test "$REBUILT" = "$TARGET_VERMAGIC" || { echo "FATAL: vermagic mismatch"; exit 1; }

          echo "=== patch markers ==="
          python3 ../nabu_patch.py compatcheck .
          echo "=== KernelSU manager binding ==="
          # kernel/Makefile prints this when KSU_MANAGER_PACKAGE is set; grepping
          # the log proves the variable survived into the compiler invocation.
          grep -q "Manager package name: ${KSU_MANAGER_PACKAGE}" ../build.log \
            || { echo "FATAL: build log does not show KSU_MANAGER_PACKAGE=${KSU_MANAGER_PACKAGE}"; \
                 echo "       the manager signature check would fall back to defaults"; exit 1; }
          echo "  ok  manager package baked in: ${KSU_MANAGER_PACKAGE}"
          if [ "${{ inputs.stage }}" = "2" ]; then
            python3 ../nabu_patch.py verify .
          else
            # stage 1 has no SUSFS: assert the KSU-only markers
            for pair in "fs/exec.c:ksu_handle_execveat_sucompat" \
                        "fs/open.c:ksu_handle_faccessat" \
                        "fs/read_write.c:ksu_handle_sys_read" \
                        "fs/stat.c:ksu_handle_stat" \
                        "drivers/input/input.c:ksu_handle_input_handle_event" \
                        "drivers/tty/pty.c:ksu_handle_devpts" \
                        "fs/namespace.c:^int path_umount" \
                        "fs/internal.h:path_umount" \
                        "drivers/Kconfig:drivers/kernelsu/Kconfig"; do
              f=${pair%%:*}; p=${pair#*:}
              grep -qE "$p" "$f" || { echo "FATAL: missing $p in $f"; exit 1; }
              echo "  ok  $f :: $p"
            done
          fi
          echo "vermagic + marker gate: PASS"
          cp "$IMG" ../Image

      - name: "13. baseline symvers"
        uses: actions/download-artifact@v4
        with:
          name: baseline-symvers
          path: baseline

      - name: "13b. Module.symvers CRC drift report (Q7)"
        run: |
          set -euo pipefail
          # This step is the ONLY hard evidence that prebuilt .ko files will still
          # load. Do not let any command here degrade to a silent success.
          BASE=baseline/Module.symvers
          NEW=kernel-source/out/Module.symvers
          test -f "$BASE" || { echo "FATAL: baseline symvers missing"; exit 1; }
          test -f "$NEW"  || { echo "FATAL: patched symvers missing"; exit 1; }

          # Module.symvers is: CRC <tab> SYMBOL <tab> MODULE <tab> EXPORT
          TAB=$(printf '\t')
          awk -F'\t' 'NF>=2 { print $2"\t"$1 }' "$BASE" | LC_ALL=C sort > base.crc
          awk -F'\t' 'NF>=2 { print $2"\t"$1 }' "$NEW"  | LC_ALL=C sort > new.crc
          echo "baseline symbols : $(wc -l < base.crc)"
          echo "patched  symbols : $(wc -l < new.crc)"

          join -t "$TAB" base.crc new.crc > joined.crc
          awk -F'\t' '$2!=$3 { print $1"\t"$2"\t"$3 }' joined.crc > crc_changed.txt
          join -t "$TAB" -v1 base.crc new.crc | cut -f1 > removed.txt
          join -t "$TAB" -v2 base.crc new.crc | cut -f1 > added.txt

          echo
          echo "=== VERDICT RULE ==="
          echo "  module_layout CRC changed        -> FATAL, a config or type moved"
          echo "  any pre-existing symbol changed  -> FATAL, same reason"
          echo "  only new ksu_*/susfs_* symbols   -> SAFE"
          echo

          ML_B=$(awk -F'\t' -v s=module_layout '$1==s{print $2}' base.crc)
          ML_N=$(awk -F'\t' -v s=module_layout '$1==s{print $2}' new.crc)
          echo "module_layout: baseline=${ML_B:-<none>} patched=${ML_N:-<none>}"
          if [ -n "$ML_B" ] && [ "$ML_B" != "$ML_N" ]; then
            echo "FATAL: module_layout CRC moved. Every prebuilt .ko will be rejected."
            echo "       diff out/.config against official.config and find the flipped symbol."
            exit 1
          fi

          changed=$(wc -l < crc_changed.txt)
          echo "pre-existing symbols with a changed CRC: $changed"
          if [ "$changed" != "0" ]; then
            echo "--- changed ---"; cat crc_changed.txt
            echo "FATAL: $changed pre-existing symbol CRC(s) moved"
            exit 1
          fi

          echo "new symbols (expected: ksu_/susfs_ only): $(wc -l < added.txt)"
          grep -vE '^(ksu_|susfs_|ksu_susfs|__ksu|ksud)' added.txt > added_unexpected.txt || true
          if [ -s added_unexpected.txt ]; then
            echo "WARNING: non KSU/SUSFS symbols appeared:"; head -40 added_unexpected.txt
          fi
          echo "removed symbols: $(wc -l < removed.txt)"; head -40 removed.txt || true

          {
            echo "stage=${{ inputs.stage }} toolchain=${{ inputs.toolchain }}"
            echo "module_layout baseline=${ML_B:-<none>} patched=${ML_N:-<none>}"
            echo "changed=$changed added=$(wc -l < added.txt) removed=$(wc -l < removed.txt)"
            echo
            echo "== CRC CHANGED =="; cat crc_changed.txt
            echo; echo "== ADDED ==";   head -300 added.txt
            echo; echo "== REMOVED =="; head -300 removed.txt
          } > symvers_diff.txt
          echo "wrote symvers_diff.txt"

      - name: "14. pack AnyKernel3 (Image + dtb + dtbo.img, boot + vendor_boot)"
        run: |
          set -euo pipefail
          STAGE="${{ inputs.stage }}"
          test -d ak3_base || { echo "FATAL: payload did not produce ak3_base/"; exit 1; }
          cp -r ak3_base/* .
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          if [ -n "${AK3_COMMIT:-}" ]; then
            git -C ak3 checkout --detach "$AK3_COMMIT" \
              || { echo "WARNING: AK3_COMMIT checkout failed, staying on HEAD"; }
          else
            echo "WARNING: AK3_COMMIT empty, using HEAD"
          fi
          git -C ak3 rev-parse HEAD > AK3_COMMIT.txt
          rm -rf ak3/.git ak3/Image* ak3/dtb ak3/modules ak3/patch
          # The upstream clone only ships tools/ak3-core.sh; the packaged binary
          # helpers of the v0.2 zip are NOT rebuilt here on purpose. See the
          # README note written below for what the flasher must provide.
          test -f ak3/tools/ak3-core.sh || { echo "FATAL: ak3-core.sh missing"; exit 1; }

          cp Image ak3/Image
          # dtb/dtbo.img are the working v0.2 blobs, always. Baseline step 9 shows why
          # they are never rebuilt: arch/arm64/Makefile L187 defines
          # KBUILD_DTBO_IMG := dtbo.img and L223-231 define $(KBUILD_DTBO_IMG): dtbs
          # inside ifeq ($(CONFIG_BUILD_ARM64_DT_OVERLAY),y); the official config leaves
          # that symbol unset, so the rule exists but never fires.
          # AnyKernel3's flash_generic dtbo flashes ak3/dtbo.img to the dtbo
          # partition.
          cp ak3_base/dtb ak3/dtb
          cp ak3_base/dtbo.img ak3/dtbo.img
          cp anykernel.sh ak3/anykernel.sh
          # Same v0.2 structure note as the baseline pack step: the boot section
          # carries patch_vbmeta_flag=auto, which ak3-core.sh treats as unset.
          sed -i "s|kernel.string=.*|kernel.string=nabu v16 stage ${STAGE} (official 4.14.180)|" ak3/anykernel.sh
          grep -q "kernel.string=nabu stage ${STAGE}" ak3/anykernel.sh \
            || { echo "FATAL: kernel.string not rewritten for stage ${STAGE}"; exit 1; }
          N_VBMETA=$(grep -c 'patch_vbmeta_flag=auto' ak3/anykernel.sh)
          [ "$N_VBMETA" = "2" ] \
            || { echo "FATAL: expected 2 patch_vbmeta_flag lines (boot+vendor_boot), got $N_VBMETA"; exit 1; }

          cd ak3
          zip -r9 "../nabu-v16-s${STAGE}.zip" . -x '*.git*' >/dev/null
          cd ..
          sha256sum "nabu-v16-s${STAGE}.zip"
          echo "=== contents ==="
          unzip -l "nabu-v16-s${STAGE}.zip" | grep -E 'Image|dtb|anykernel.sh|ak3-core'

          cat > README-ROLLBACK.txt <<'ROLLBACKEOF'
          nabu v16 rollback
          =================

          This package was flashed by AnyKernel3, which rewrote boot and vendor_boot in
          place. AnyKernel3 does NOT back up the previous images, so the only reliable
          rollback source is the MIUI14 fastboot ROM for nabu:

            boot.img, vendor_boot.img and dtbo.img live inside images/ in the tgz.
            fastboot flash boot         boot.img
            fastboot flash vendor_boot  vendor_boot.img
            fastboot flash dtbo         dtbo.img
            fastboot reboot

          Either way the tablet boots WITHOUT root afterwards. To get the Kuugo v0.2
          kernel + KernelSU-Next back, reflash
          nabu_Hyperos1_KernelSU-Next_anykernel3_v0.2.zip with the KernelSU manager
          (it is an AnyKernel3 zip, not a recovery package).

          Slot note: this device is virtual A/B. `fastboot flash boot` writes the active
          slot; add _a / _b explicitly if you need to repair the other one.

          Flasher requirement
          -------------------
          This package does NOT bundle magiskboot or busybox. Upstream AnyKernel3 only
          ships tools/ak3-core.sh; the helper binaries of the original v0.2 zip are not
          reproduced here, and substituting them from a Magisk APK would replace
          osm0sis' applet set with an incompatible one.

          Flash it with a flasher that already provides magiskboot: KernelSU manager ->
          install -> pick this zip. If flashing reports "Splitting image failed", the
          flasher has no magiskboot - use the KernelSU manager, not a third-party
          recovery.
          ROLLBACKEOF

      - name: "15. upload"
        uses: actions/upload-artifact@v4
        with:
          name: nabu-v16-s${{ inputs.stage }}
          path: |
            nabu-v16-s${{ inputs.stage }}.zip
            README-ROLLBACK.txt
            AK3_COMMIT.txt
          if-no-files-found: error

      - name: "15b. upload symvers report"
        uses: actions/upload-artifact@v4
        with:
          name: symvers-diff-s${{ inputs.stage }}
          path: symvers_diff.txt
          if-no-files-found: warn

      - name: "16. build log on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-s${{ inputs.stage }}
          path: build.log
          if-no-files-found: warn
