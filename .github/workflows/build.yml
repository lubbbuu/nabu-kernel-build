name: "Build nabu KernelSU-Next + SUSFS"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "1. 环境准备"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git zip bc flex bison libssl-dev \
            libelf-dev python3 device-tree-compiler aria2 ccache

      - name: "2. 装 Clang 工具链"
        run: |
          mkdir -p ${{ github.workspace }}/toolchains/neutron-clang
          cd ${{ github.workspace }}/toolchains/neutron-clang
          aria2c https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman
          ./antman -S
          ./antman -I

      - name: "3. 拉内核源码（Kuugo HyperOS1 干净树）"
        run: |
          git clone --depth=1 -b HyperOS1 \
            https://github.com/Kuugo2002/xiaomi_kernel_nabu.git kernel-source

      - name: "4. 打 SUSFS 4.14 补丁（必须先于 KSU，避免冲突）"
        run: |
          cd ${{ github.workspace }}
          git clone --depth=1 -b kernel-4.14 https://github.com/ShirkNeko/susfs4ksu.git susfs
          cd kernel-source
          cp -r ${{ github.workspace }}/susfs/kernel_patches/fs/* fs/
          cp -r ${{ github.workspace }}/susfs/kernel_patches/include/linux/* include/linux/
          patch -p1 --forward < ${{ github.workspace }}/susfs/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true
          echo "=== 检查 rej ==="
          find . -name "*.rej" | head -20

      - name: "5. 接入 KernelSU-Next v3.1.0-legacy"
        run: |
          cd ${{ github.workspace }}
          git clone --depth=1 -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git ksu-next
          cd ksu-next && git fetch --depth=1 origin tag v3.1.0-legacy && git checkout v3.1.0-legacy
          cd ${{ github.workspace }}
          rm -rf kernel-source/drivers/kernelsu
          cp -r ksu-next/kernel kernel-source/drivers/kernelsu
          sed -i 's/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := 33024/' kernel-source/drivers/kernelsu/Kbuild || true
          sed -i 's/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := v3.1.0-legacy/' kernel-source/drivers/kernelsu/Kbuild || true
          grep -q 'kernelsu/' kernel-source/drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> kernel-source/drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' kernel-source/drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' kernel-source/drivers/Kconfig

      - name: "6. 插入 manual hook（python 精确插入，不用 patch）"
        run: |
          cd ${{ github.workspace }}/kernel-source
          python3 - <<'PYEOF'
import io, sys

def edit(path, anchor, insert, after=False, guard='ksu_handle'):
    s = open(path, encoding='utf-8', errors='ignore').read()
    if guard in s and anchor not in s.split(guard)[0][-500:]:
        pass
    if insert.strip().split('\n')[1].strip() in s:
        print('SKIP (already hooked):', path); return
    if anchor not in s:
        print('MISS anchor:', path, repr(anchor)); sys.exit(3)
    s = s.replace(anchor, (anchor + insert) if after else (insert + anchor), 1)
    open(path, 'w', encoding='utf-8').write(s)
    print('HOOKED:', path)

# 1) kernel/reboot.c —— supercall 入口
edit('kernel/reboot.c',
     'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,',
     '''#ifdef CONFIG_KSU
extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,
		void __user **arg);
#endif

''')

# 2) reboot.c 函数体内 —— 真正调用
edit('kernel/reboot.c',
     '''	struct pid_namespace *pid_ns = task_active_pid_ns(current);
	char buffer[256];
	int ret = 0;
''',
     '''
#ifdef CONFIG_KSU
	{
		int __ksu_ret = ksu_handle_sys_reboot(magic1, magic2, cmd,
				(void __user **)&arg);
		if (__ksu_ret)
			return __ksu_ret;
	}
#endif
''',
     after=True)

# 3) kernel/sys.c —— setresuid 授权跟踪
edit('kernel/sys.c',
     'SYSCALL_DEFINE3(setresuid, uid_t, ruid, uid_t, euid, uid_t, suid)\n{\n',
     '''#ifdef CONFIG_KSU
	extern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);
	ksu_handle_setresuid(ruid, euid, suid);
#endif

''',
     after=True)

# 4) fs/stat.c —— stat 伪装
edit('fs/stat.c',
     'int vfs_statx(int dfd, const char __user *filename, int flags,\n',
     '''#ifdef CONFIG_KSU
extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
#endif

''')

edit('fs/stat.c',
     '''	struct path path;
	int error = -EINVAL;
	unsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;
''',
     '''
#ifdef CONFIG_KSU
	ksu_handle_stat(&dfd, &filename, &flags);
#endif
''',
     after=True)

# 5) drivers/input/input.c —— 输入事件监控
edit('drivers/input/input.c',
     '''static void input_handle_event(struct input_dev *dev,
			       unsigned int type, unsigned int code, int value)
{
''',
     '''#ifdef CONFIG_KSU
	extern int ksu_handle_input_handle_event(unsigned int *type,
			unsigned int *code, int *value);
	ksu_handle_input_handle_event(&type, &code, &value);
#endif

''',
     after=True)

print('ALL HOOKS DONE')
PYEOF
          echo "=== 验证 hook ==="
          grep -c ksu_handle kernel/reboot.c kernel/sys.c fs/stat.c drivers/input/input.c

      - name: "7. 生成并修改 .config"
        run: |
          export PATH="${{ github.workspace }}/toolchains/neutron-clang/bin:$PATH"
          cd ${{ github.workspace }}/kernel-source
          make ARCH=arm64 SUBARCH=arm64 O=out nabu_defconfig
          S="scripts/config --file out/.config"
          $S --enable KSU
          $S --enable KSU_MANUAL_HOOK
          $S --enable KSU_SUSFS
          $S --enable KSU_SUSFS_SUS_PATH
          $S --enable KSU_SUSFS_SUS_MOUNT
          $S --enable KSU_SUSFS_SUS_KSTAT
          $S --enable KSU_SUSFS_SPOOF_UNAME
          $S --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          $S --enable KSU_SUSFS_ENABLE_LOG
          $S --enable SDCARD_FS
          $S --enable OVERLAY_FS
          make ARCH=arm64 SUBARCH=arm64 O=out olddefconfig
          grep -E "CONFIG_KSU=|CONFIG_KSU_SUSFS|CONFIG_SDCARD_FS" out/.config

      - name: "8. 编译内核"
        run: |
          export PATH="${{ github.workspace }}/toolchains/neutron-clang/bin:$PATH"
          cd ${{ github.workspace }}/kernel-source
          make ARCH=arm64 SUBARCH=arm64 O=out \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 LD=ld.lld \
            CC="ccache clang" -j$(nproc --all) Image

      - name: "9. 打包 AnyKernel3"
        run: |
          cd ${{ github.workspace }}
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/Image ak3/Image.gz ak3/dtb
          cp kernel-source/out/arch/arm64/boot/Image ak3/Image
          sed -i 's/^kernel.string=.*/kernel.string=nabu KSU-Next v3.1.0-legacy + SUSFS/' ak3/anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=nabu/' ak3/anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=1/' ak3/anykernel.sh
          sed -i 's/^is_slot_device=.*/is_slot_device=1/' ak3/anykernel.sh
          cd ak3
          zip -r9 ${{ github.workspace }}/nabu-KSU-Next-SUSFS.zip . -x "*.git*"
          cd ..
          sha256sum nabu-KSU-Next-SUSFS.zip

      - name: "10. 上传产物"
        uses: actions/upload-artifact@v4
        with:
          name: nabu-KSU-Next-SUSFS
          path: |
            nabu-KSU-Next-SUSFS.zip
            $(find kernel-source -name "*.rej" 2>/dev/null)

