name: "Build nabu KernelSU-Next + SUSFS"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "1. 环境准备"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git zip bc flex bison libssl-dev libelf-dev python3 device-tree-compiler aria2 ccache gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: "2. 装 Clang 工具链"
        run: |
          mkdir -p toolchains/neutron-clang
          cd toolchains/neutron-clang
          aria2c https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman
          ./antman -S
          ./antman -I

      - name: "3. 拉内核源码 Kuugo HyperOS1"
        run: |
          git clone --depth=1 -b HyperOS1 https://github.com/Kuugo2002/xiaomi_kernel_nabu.git kernel-source

      - name: "4. 还原 hook 脚本"
        run: |
          echo '' | base64 -d > insert_hooks.py
          ls -l insert_hooks.py
          python3 -c "import ast;ast.parse(open('insert_hooks.py').read());print('hook 脚本语法 OK')"

      - name: "5. 插入 manual hook + path_umount"
        run: |
          cd kernel-source
          python3 ../insert_hooks.py
          echo "=== ksu_handle 验证 ==="
          grep -c ksu_handle kernel/reboot.c kernel/sys.c fs/stat.c drivers/input/input.c
          echo "=== path_umount 验证 ==="
          grep -c "int path_umount" fs/namespace.c fs/internal.h

      - name: "6. 接入 KernelSU-Next v3.1.0-legacy"
        run: |
          git clone --depth=1 -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git ksu-next
          cd ksu-next
          git fetch --depth=1 origin tag v3.1.0-legacy
          git checkout v3.1.0-legacy
          cd ..
          rm -rf kernel-source/drivers/kernelsu
          cp -r ksu-next/kernel kernel-source/drivers/kernelsu
          sed -i 's/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := 33024/' kernel-source/drivers/kernelsu/Kbuild || true
          sed -i 's/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := v3.1.0-legacy/' kernel-source/drivers/kernelsu/Kbuild || true
          grep -q 'kernelsu/' kernel-source/drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> kernel-source/drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' kernel-source/drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' kernel-source/drivers/Kconfig
          grep -n 'kernelsu' kernel-source/drivers/Makefile kernel-source/drivers/Kconfig

      - name: "7. 打 SUSFS 4.14 补丁"
        run: |
          git clone --depth=1 -b kernel-4.14 https://github.com/ShirkNeko/susfs4ksu.git susfs
          cd kernel-source
          cp -r ../susfs/kernel_patches/fs/* fs/
          cp -r ../susfs/kernel_patches/include/linux/* include/linux/
          patch -p1 --forward < ../susfs/kernel_patches/50_add_susfs_in_kernel-4.14.patch || echo "SUSFS patch 有 reject，继续"
          echo "=== rej 文件 ==="
          find . -name "*.rej" | head -20

      - name: "8. 生成并修改 .config"
        run: |
          export PATH="$PWD/toolchains/neutron-clang/bin:$PATH"
          cd kernel-source
          make ARCH=arm64 SUBARCH=arm64 O=out nabu_defconfig
          S="scripts/config --file out/.config"
          $S --enable KSU
          $S --enable KSU_MANUAL_HOOK
          $S --enable KSU_SUSFS
          $S --enable KSU_SUSFS_SUS_PATH
          $S --enable KSU_SUSFS_SUS_MOUNT
          $S --enable KSU_SUSFS_SUS_KSTAT
          $S --enable KSU_SUSFS_SPOOF_UNAME
          $S --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          $S --enable KSU_SUSFS_ENABLE_LOG
          $S --enable SDCARD_FS
          $S --enable OVERLAY_FS
          $S --disable WERROR
          make ARCH=arm64 SUBARCH=arm64 O=out olddefconfig
          grep -E "CONFIG_KSU=|CONFIG_KSU_SUSFS|CONFIG_SDCARD_FS|CONFIG_WERROR" out/.config

      - name: "9. 编译内核（第一轮）"
        id: build1
        continue-on-error: true
        run: |
          export PATH="$PWD/toolchains/neutron-clang/bin:$PATH"
          cd kernel-source
          make ARCH=arm64 SUBARCH=arm64 O=out \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AS=aarch64-linux-gnu-as LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-w" \
            -j$(nproc --all) Image

      - name: "10. 编译内核（重试 KCFLAGS=-w）"
        if: steps.build1.outcome == 'failure'
        run: |
          export PATH="$PWD/toolchains/neutron-clang/bin:$PATH"
          cd kernel-source
          make ARCH=arm64 SUBARCH=arm64 O=out \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AS=aarch64-linux-gnu-as LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-w -Wno-error" \
            -j$(nproc --all) Image
          ls -lh arch/arm64/boot/Image

      - name: "11. 打包 AnyKernel3"
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/Image ak3/Image.gz ak3/dtb
          cp kernel-source/out/arch/arm64/boot/Image ak3/Image
          sed -i 's/^kernel.string=.*/kernel.string=nabu KSU-Next v3.1.0-legacy + SUSFS/' ak3/anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=nabu/' ak3/anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=1/' ak3/anykernel.sh
          sed -i 's/^is_slot_device=.*/is_slot_device=1/' ak3/anykernel.sh
          cd ak3
          zip -r9 ../nabu-KSU-Next-SUSFS.zip . -x "*.git*"
          cd ..
          sha256sum nabu-KSU-Next-SUSFS.zip
          ls -lh nabu-KSU-Next-SUSFS.zip

      - name: "12. 上传产物"
        uses: actions/upload-artifact@v4
        with:
          name: nabu-KSU-Next-SUSFS
          path: nabu-KSU-Next-SUSFS.zip
