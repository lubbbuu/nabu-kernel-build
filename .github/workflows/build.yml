name: "nabu v12 KSU+SUSFS"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "1. env"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git zip bc flex bison libssl-dev libelf-dev python3 device-tree-compiler aria2 ccache gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: "2. clang"
        run: |
          mkdir -p toolchains/neutron-clang
          cd toolchains/neutron-clang
          aria2c https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman
          ./antman -S
          ./antman -I

      - name: "3. scripts"
        run: |
          echo '' | base64 -d > apply_patch.py
          echo '' | base64 -d > fix_hunks.py
          echo '' | base64 -d > hooks_v2.py
          echo '' | base64 -d > anykernel.sh
          python3 -c "import ast;ast.parse(open('apply_patch.py').read());ast.parse(open('fix_hunks.py').read());ast.parse(open('hooks_v2.py').read());print('scripts ok')"

      - name: "4. KSU v1.0.5"
        run: |
          curl -fsSL -o ksu.zip https://github.com/tiann/KernelSU/archive/refs/tags/v1.0.5.zip
          unzip -q ksu.zip
          test -d KernelSU-1.0.5 || { echo "unzip failed"; exit 1; }
          mv KernelSU-1.0.5 ksu-src

      - name: "5. kernel source"
        run: |
          git clone --depth=1 -b HyperOS1 https://github.com/Kuugo2002/xiaomi_kernel_nabu.git kernel-source

      - name: "6. susfs into KSU"
        run: |
          git clone --depth=1 -b kernel-4.14 https://github.com/ShirkNeko/susfs4ksu.git sfk
          cp sfk/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ksu-src/
          cd ksu-src
          python3 ../apply_patch.py 10_enable_susfs_for_ksu.patch .
          grep -c CONFIG_KSU_SUSFS kernel/core_hook.c
          grep -c KSU_SUSFS kernel/Kconfig

      - name: "7. install into kernel"
        run: |
          rm -rf kernel-source/drivers/kernelsu
          cp -r ksu-src/kernel kernel-source/drivers/kernelsu
          grep -q 'kernelsu/' kernel-source/drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> kernel-source/drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' kernel-source/drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' kernel-source/drivers/Kconfig
          grep -n kernelsu kernel-source/drivers/Makefile kernel-source/drivers/Kconfig

      - name: "8. susfs kernel patch"
        run: |
          curl -fsSL -o 50_add.patch https://raw.githubusercontent.com/ebears/OnePlus-SM8150-Kernel-Builds/main/patches/100_add_susfs_in_kernel-for-kernel-4.14.patch
          cp sfk/kernel_patches/fs/susfs.c kernel-source/fs/
          cp sfk/kernel_patches/fs/sus_su.c kernel-source/fs/
          cp sfk/kernel_patches/include/linux/susfs.h kernel-source/include/linux/
          cp sfk/kernel_patches/include/linux/susfs_def.h kernel-source/include/linux/
          cp sfk/kernel_patches/include/linux/sus_su.h kernel-source/include/linux/
          cd kernel-source
          python3 ../apply_patch.py ../50_add.patch . || true
          python3 ../fix_hunks.py
          python3 ../hooks_v2.py
          echo "=== FINAL CHECK ==="
          grep -c path_umount fs/namespace.c fs/internal.h
          grep -c susfs_spoof_cmdline fs/proc/cmdline.c
          grep -c ksu_handle_execveat_sucompat fs/exec.c
          grep -c ksu_handle_faccessat fs/open.c
          grep -c ksu_handle_sys_read fs/read_write.c
          grep -c ksu_handle_stat fs/stat.c
          grep -c ksu_handle_input_handle_event drivers/input/input.c
          grep -c ksu_handle_devpts drivers/tty/pty.c
          echo "=== android_kabi_reserved 检查 ==="
          grep -c android_kabi_reserved fs/dcache.c || echo "0 (good)"

      - name: "9. config"
        run: |
          export PATH="$PWD/toolchains/neutron-clang/bin:$PATH"
          cd kernel-source
          make ARCH=arm64 SUBARCH=arm64 O=out nabu_defconfig
          S="scripts/config --file out/.config"
          $S --enable KSU
          $S --disable KSU_SUSFS_SUS_SU
          $S --enable KSU_SUSFS
          $S --enable KSU_SUSFS_HAS_MAGIC_MOUNT
          $S --enable KSU_SUSFS_SUS_PATH
          $S --enable KSU_SUSFS_SUS_MOUNT
          $S --enable KSU_SUSFS_SUS_KSTAT
          $S --enable KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          $S --enable KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          $S --enable KSU_SUSFS_TRY_UMOUNT
          $S --enable KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          $S --enable KSU_SUSFS_SPOOF_UNAME
          $S --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          $S --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          $S --enable KSU_SUSFS_ENABLE_LOG
          $S --enable SDCARD_FS
          $S --enable OVERLAY_FS
          $S --disable WERROR
          $S --disable KPROBES
          make ARCH=arm64 SUBARCH=arm64 O=out olddefconfig
          echo "=== key configs ==="
          grep -E "CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_SDCARD_FS=|CONFIG_OVERLAY_FS=|CONFIG_KPROBES|CONFIG_WERROR" out/.config

      - name: "10. build (log to file)"
        run: |
          export PATH="$PWD/toolchains/neutron-clang/bin:$PATH"
          cd kernel-source
          set +e
          make ARCH=arm64 SUBARCH=arm64 O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- AS=aarch64-linux-gnu-as LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip KCFLAGS="-w -Wno-error" -j$(nproc --all) Image > ../build.log 2>&1
          RC=$?
          echo "make exit code: $RC"
          echo "===== 所有错误行 ====="
          grep -nE "错误:|error:|Error [0-9]|undefined|No such file" ../build.log | head -40
          echo "===== 日志末尾 60 行 ====="
          tail -60 ../build.log
          if [ $RC -ne 0 ]; then exit 1; fi
          ls -lh arch/arm64/boot/Image

      - name: "11. pack"
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/Image ak3/Image.gz ak3/dtb ak3/modules ak3/patch
          cp kernel-source/out/arch/arm64/boot/Image ak3/Image
          cp anykernel.sh ak3/anykernel.sh
          cd ak3
          zip -r9 ../nabu-v12-KSU-SUSFS.zip . -x "*.git*"
          cd ..
          sha256sum nabu-v12-KSU-SUSFS.zip
          ls -lh nabu-v12-KSU-SUSFS.zip

      - name: "12. upload"
        uses: actions/upload-artifact@v4
        with:
          name: nabu-v12-KSU-SUSFS
          path: nabu-v12-KSU-SUSFS.zip

      - name: "13. upload build log on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
